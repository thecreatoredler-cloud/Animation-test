<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0b14">
<title>Night Shift Benchmark</title>
<style>
  :root { --bg:#0d0b14; --ink:#f4efe6; --accent:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none;
  }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#2b2440; }
  #stage canvas { display:block; }
  #hud {
    position:absolute; top:10px; left:10px; padding:6px 8px; border-radius:6px;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre;
    background:rgba(0,0,0,.5); pointer-events:none;
  }
  #title {
    position:absolute; top:18%; left:0; right:0; text-align:center; pointer-events:none;
    transition:opacity .4s; text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  #title h1 { font-size:30px; letter-spacing:.06em; font-weight:800; }
  #title p { font-size:14px; opacity:.85; margin-top:6px; }
  #summary {
    position:absolute; left:14px; right:14px; bottom:84px; display:none; padding:10px 14px;
    background:rgba(12,9,20,.88); border:1px solid rgba(255,255,255,.16); border-radius:12px;
    font:13px/1.6 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap;
  }
  #summary b { color:var(--accent); font-family:system-ui,sans-serif; font-size:15px; }
  #controls {
    position:absolute; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:10px;
  }
  button {
    font:700 16px system-ui,sans-serif; border:0; border-radius:999px; min-height:50px;
    padding:0 28px; background:var(--accent); color:#1a1208; box-shadow:0 4px 16px rgba(0,0,0,.45);
  }
  button.ghost { background:rgba(255,255,255,.18); color:var(--ink); padding:0 18px; font-size:14px; }
  button:active { transform:scale(.96); }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; background:rgba(0,0,0,.8); font-size:15px; line-height:1.5; }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">loading…</div>
  <div id="title"><h1>NIGHT SHIFT</h1><p>5-second visual benchmark</p></div>
  <div id="summary"></div>
  <div id="controls">
    <button id="play" disabled>▶ Start</button>
    <button id="restart" class="ghost">↺</button>
    <button id="hudBtn" class="ghost">HUD</button>
  </div>
  <div id="msg"></div>
</div>

<script>
  // Shown if Three.js cannot load or WebGL fails.
  function showMsg(t){ var m=document.getElementById('msg'); m.textContent=t; m.style.display='flex'; }
  window.addEventListener('error', function(e){ showMsg('Error: ' + (e.message || 'script failed to load')); });
  setTimeout(function(){ if(!window.__ready) showMsg('Could not start. Check your connection (Three.js loads from cdn.jsdelivr.net) and that WebGL is enabled.'); }, 12000);
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }

<script type="module">
import * as THREE from 'three';

/* ================================================================
   Setup
   ================================================================ */
const DURATION = 5.0;
const INK = '#1b1622';
const stage = document.getElementById('stage');
const hudEl = document.getElementById('hud');
const titleEl = document.getElementById('title');
const summaryEl = document.getElementById('summary');
const playBtn = document.getElementById('play');

const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: MAX_DPR < 1.5, powerPreference: 'high-performance', stencil: false });
} catch (e) { showMsg('WebGL is not available on this device/browser.'); throw e; }
renderer.setPixelRatio(MAX_DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG = 0x2b2440;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 10, 30);

const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.1, 60);

/* ---------- helpers ---------- */
const ANISO = Math.min(4, renderer.capabilities.getMaxAnisotropy());
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function freeze(o) { o.updateMatrix(); o.matrixAutoUpdate = false; return o; }
// seeded random so the benchmark is identical every run
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const lerp = (a, b, k) => a + (b - a) * k;

/* ================================================================
   Procedural textures
   ================================================================ */
const floorTex = canvasTex(256, 256, (g, w) => {
  g.fillStyle = '#6e8197'; g.fillRect(0, 0, w, w);
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    g.fillStyle = (i + j) % 2 ? '#b4c6d6' : '#a2b5c8';
    g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(i * s + 6, j * s + 6, s - 12, 6);
  }
  for (let k = 0; k < 260; k++) { g.fillStyle = `rgba(40,50,70,${0.05 + rnd() * 0.1})`; g.fillRect(rnd() * w, rnd() * w, 2, 2); }
}, [3, 15]);

const wallTex = canvasTex(512, 512, (g, w, h) => {
  const split = Math.round(h * (1 - 1.3 / 4));
  g.fillStyle = '#e6dcc8'; g.fillRect(0, 0, w, split);
  g.fillStyle = '#3f8d8a'; g.fillRect(0, split, w, h - split);
  g.strokeStyle = 'rgba(60,40,30,.10)'; g.lineWidth = 2;
  for (let y = 0, r = 0; y < h; y += 32, r++) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    for (let x = (r % 2) * 64; x < w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); }
  }
  g.fillStyle = '#2b5e63'; g.fillRect(0, split - 6, w, 12);
  g.fillStyle = '#1f2a33'; g.fillRect(0, h - 22, w, 22);
}, [7.5, 1]);

const lockerTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d2d2d2'; rrect(g, 12, 12, w - 24, h - 24, 6); g.fill();
  g.strokeStyle = INK; g.lineWidth = 5; g.strokeRect(3, 3, w - 6, h - 6);
  g.fillStyle = '#3a3340'; for (let i = 0; i < 5; i++) { rrect(g, 34, 30 + i * 11, 60, 5, 2); g.fill(); }
  g.fillStyle = '#3a3340'; rrect(g, 92, 120, 12, 34, 4); g.fill();
  g.fillStyle = '#f7f3e8'; g.fillRect(40, 196, 48, 20); g.strokeStyle = '#555'; g.lineWidth = 2; g.strokeRect(40, 196, 48, 20);
});

function doorTex(label) {
  return canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = '#26323f'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#4c86a8'; g.fillRect(16, 40, w - 32, h - 40);
    g.fillStyle = '#9fd3ee'; g.fillRect(70, 90, 116, 140);
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
    for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(70 + i * 19.3, 90); g.lineTo(70 + i * 19.3, 230); g.stroke(); g.beginPath(); g.moveTo(70, 90 + i * 23.3); g.lineTo(186, 90 + i * 23.3); g.stroke(); }
    g.strokeStyle = INK; g.lineWidth = 6; g.strokeRect(70, 90, 116, 140);
    g.fillStyle = '#c9a24a'; rrect(g, 190, 270, 16, 54, 6); g.fill();
    g.fillStyle = '#3a6c88'; g.fillRect(16, h - 70, w - 32, 70);
    g.fillStyle = '#f2efe6'; g.fillRect(88, 6, 80, 28);
    g.fillStyle = INK; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 128, 21);
    g.strokeStyle = INK; g.lineWidth = 6; g.strokeRect(16, 40, w - 32, h - 43);
  });
}

const windowTex = canvasTex(512, 320, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#5a4f9a'); sky.addColorStop(0.45, '#ff8a5c'); sky.addColorStop(0.75, '#ffd27a'); sky.addColorStop(1, '#ffe7b0');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff1c4'; g.beginPath(); g.arc(360, 225, 46, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3d2b52';
  let x = 0; while (x < w) { const bw = 30 + rnd() * 50, bh = 40 + rnd() * 90; g.fillRect(x, h - bh, bw, bh); x += bw + 4; }
  g.fillStyle = 'rgba(255,240,210,.55)'; for (let y = 10; y < h * 0.45; y += 16) g.fillRect(0, y, w, 7);
  g.strokeStyle = '#2a2235'; g.lineWidth = 18; g.strokeRect(9, 9, w - 18, h - 18);
  g.lineWidth = 10; g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke();
});

const signTex = canvasTex(512, 160, (g, w, h) => {
  g.fillStyle = '#1f5f45'; rrect(g, 6, 6, w - 12, h - 12, 20); g.fill();
  g.strokeStyle = '#f4efe6'; g.lineWidth = 6; rrect(g, 18, 18, w - 36, h - 36, 14); g.stroke();
  g.fillStyle = '#f4efe6'; g.font = 'bold 72px sans-serif'; g.textBaseline = 'middle'; g.fillText('HALL B', 50, h / 2 + 4);
  g.beginPath(); g.moveTo(370, 55); g.lineTo(440, 80); g.lineTo(370, 105); g.closePath(); g.fill(); g.fillRect(330, 70, 50, 20);
});

const boardTex = canvasTex(512, 320, (g, w, h) => {
  g.fillStyle = '#7a4a2a'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#c99a62'; g.fillRect(14, 14, w - 28, h - 28);
  const cols = ['#fff6d6', '#ffd0dc', '#cfe8ff', '#d9f5c8', '#fff'];
  for (let i = 0; i < 9; i++) {
    const px = 30 + (i % 3) * 155 + rnd() * 20, py = 30 + Math.floor(i / 3) * 92 + rnd() * 10;
    g.save(); g.translate(px + 55, py + 35); g.rotate((rnd() - 0.5) * 0.15);
    g.fillStyle = cols[i % 5]; g.fillRect(-55, -35, 110, 72);
    g.fillStyle = 'rgba(40,30,40,.45)'; for (let l = 0; l < 4; l++) g.fillRect(-42, -20 + l * 13, 60 + rnd() * 25, 4);
    g.fillStyle = '#d33'; g.beginPath(); g.arc(0, -30, 5, 0, 7); g.fill(); g.restore();
  }
});

function posterTex(bg, fg, text) {
  return canvasTex(256, 360, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.beginPath(); g.arc(w / 2, 140, 80, 0, 7); g.fill();
    g.fillStyle = bg; g.beginPath(); g.arc(w / 2 + 30, 120, 60, 0, 7); g.fill();
    g.fillStyle = fg; g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.fillText(text, w / 2, 300);
    g.strokeStyle = INK; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8);
  });
}

const clockTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#f7f3ea'; g.beginPath(); g.arc(128, 128, 118, 0, 7); g.fill();
  g.strokeStyle = INK; g.lineWidth = 12; g.stroke();
  g.fillStyle = INK; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.fillRect(128 + Math.sin(a) * 92 - 4, 128 - Math.cos(a) * 92 - 4, 8, 8); }
});
const handTex = canvasTex(16, 128, (g) => { g.fillStyle = INK; rrect(g, 3, 0, 10, 128, 5); g.fill(); });

const shaftTex = canvasTex(64, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, 'rgba(255,214,150,.9)'); gr.addColorStop(1, 'rgba(255,170,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const patchTex = canvasTex(256, 256, (g, w, h) => {
  for (let i = 0; i < 6; i++) {
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, 'rgba(255,200,130,0)'); gr.addColorStop(0.5, 'rgba(255,200,130,.85)'); gr.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = gr; g.fillRect(0, 12 + i * 40, w, 24);
  }
});
const dotTex = canvasTex(32, 32, (g) => {
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,240,210,1)'); gr.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
});
const blobTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(20,10,30,.55)'); gr.addColorStop(1, 'rgba(20,10,30,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});

/* ---------- character art (flat ink illustration) ---------- */
function headTex(mode) { // 'open' | 'blink' | 'happy'
  return canvasTex(256, 256, (g) => {
    const cx = 128, cy = 140, r = 92;
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.fillStyle = '#fbf3e6'; g.strokeStyle = INK; g.lineWidth = 9;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill(); g.stroke();
    // cap
    g.fillStyle = '#2f5d8a';
    g.beginPath(); g.arc(cx, cy, r + 4, Math.PI * 1.1, Math.PI * 1.9); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(cx + 26, cy - 38, 80, 12, -0.04, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#f3c44f'; g.beginPath(); g.arc(cx - 6, cy - 72, 9, 0, 7); g.fill(); g.lineWidth = 4; g.stroke();
    // hair tufts
    g.fillStyle = '#6b3d22'; g.lineWidth = 5;
    g.beginPath(); g.ellipse(cx - 84, cy - 20, 12, 20, 0.3, 0, 7); g.fill(); g.stroke();
    // cheeks
    g.fillStyle = 'rgba(255,110,130,.35)';
    g.beginPath(); g.ellipse(cx - 52, cy + 30, 16, 9, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(cx + 52, cy + 30, 16, 9, 0, 0, 7); g.fill();
    // eyes
    g.strokeStyle = INK; g.fillStyle = INK; g.lineWidth = 7;
    for (const ex of [cx - 30, cx + 30]) {
      if (mode === 'open') {
        g.beginPath(); g.ellipse(ex, cy + 4, 9, 14, 0, 0, 7); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 3, cy - 2, 3.5, 0, 7); g.fill(); g.fillStyle = INK;
      } else if (mode === 'blink') {
        g.beginPath(); g.moveTo(ex - 11, cy + 6); g.quadraticCurveTo(ex, cy + 12, ex + 11, cy + 6); g.stroke();
      } else {
        g.beginPath(); g.moveTo(ex - 12, cy + 8); g.quadraticCurveTo(ex, cy - 8, ex + 12, cy + 8); g.stroke();
      }
    }
    // brows
    g.lineWidth = 6;
    g.beginPath(); g.moveTo(cx - 42, cy - 18); g.lineTo(cx - 20, cy - 22); g.stroke();
    g.beginPath(); g.moveTo(cx + 20, cy - 22); g.lineTo(cx + 42, cy - 18); g.stroke();
    // mouth
    if (mode === 'happy') {
      g.fillStyle = '#5a1f2b'; g.beginPath(); g.moveTo(cx - 22, cy + 36); g.quadraticCurveTo(cx, cy + 72, cx + 22, cy + 36); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#ff8aa0'; g.beginPath(); g.ellipse(cx, cy + 50, 9, 6, 0, 0, 7); g.fill();
    } else {
      g.lineWidth = 6; g.beginPath(); g.moveTo(cx - 16, cy + 40); g.quadraticCurveTo(cx, cy + 50, cx + 16, cy + 40); g.stroke();
    }
  });
}
const HEAD = { open: headTex('open'), blink: headTex('blink'), happy: headTex('happy') };

const torsoTex = canvasTex(256, 256, (g) => {
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = '#f3c44f'; g.strokeStyle = INK; g.lineWidth = 9;
  rrect(g, 64, 14, 128, 232, 42); g.fill(); g.stroke();
  // straps
  for (const [x0, x1] of [[90, 80], [166, 176]]) {
    g.strokeStyle = INK; g.lineWidth = 22; g.beginPath(); g.moveTo(x0, 104); g.lineTo(x1, 26); g.stroke();
    g.strokeStyle = '#3e6ea8'; g.lineWidth = 12; g.beginPath(); g.moveTo(x0, 104); g.lineTo(x1, 26); g.stroke();
  }
  // bib
  g.fillStyle = '#3e6ea8'; g.strokeStyle = INK; g.lineWidth = 9;
  g.beginPath(); g.moveTo(82, 98); g.lineTo(174, 98); g.lineTo(182, 246); g.lineTo(74, 246); g.closePath(); g.fill(); g.stroke();
  g.lineWidth = 4; g.strokeRect(104, 128, 48, 36);
  g.fillStyle = '#f3c44f'; for (const bx of [92, 164]) { g.beginPath(); g.arc(bx, 108, 7, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = '#f7f3ea'; g.fillRect(110, 134, 36, 18);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3; g.beginPath(); g.moveTo(128, 180); g.lineTo(128, 244); g.stroke();
});

const armTex = canvasTex(64, 256, (g) => {
  g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = 11;
  g.beginPath(); g.moveTo(32, 30); g.lineTo(32, 212); g.stroke();
  g.fillStyle = '#f3c44f'; g.lineWidth = 6; rrect(g, 12, 4, 40, 50, 16); g.fill(); g.stroke();
  g.fillStyle = '#fbf3e6'; g.beginPath(); g.arc(32, 226, 20, 0, 7); g.fill(); g.lineWidth = 6; g.stroke();
});
const legTex = canvasTex(64, 256, (g) => {
  g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = 12;
  g.beginPath(); g.moveTo(32, 6); g.lineTo(32, 222); g.stroke();
  g.fillStyle = INK; g.beginPath(); g.ellipse(34, 236, 27, 15, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(26, 230, 9, 4, 0, 0, 7); g.fill();
});

/* ================================================================
   Environment: a school hallway at sunset
   ================================================================ */
const HALL_W = 6, HALL_L = 30, HALL_H = 4, HALL_Z = -11;
const lam = (o) => new THREE.MeshLambertMaterial(o);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_L), lam({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, HALL_Z); floor.receiveShadow = true;
scene.add(freeze(floor));

const wallMat = lam({ map: wallTex });
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(HALL_L, HALL_H), wallMat);
leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-HALL_W / 2, HALL_H / 2, HALL_Z); leftWall.receiveShadow = true;
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(HALL_L, HALL_H), wallMat);
rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(HALL_W / 2, HALL_H / 2, HALL_Z); rightWall.receiveShadow = true;
const ceilTex = canvasTex(128, 128, (g, w) => {
  g.fillStyle = '#d9d4e4'; g.fillRect(0, 0, w, w);
  g.strokeStyle = '#8f88a3'; g.lineWidth = 4; g.strokeRect(0, 0, w, w);
  g.fillStyle = 'rgba(80,70,100,.12)'; for (let k = 0; k < 120; k++) g.fillRect(rnd() * w, rnd() * w, 2, 2);
}, [6, 30]);
// unlit (cheaper, and a downward-facing surface gets almost no light from the sky hemisphere)
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_L), new THREE.MeshBasicMaterial({ map: ceilTex, color: 0x8f88a8 }));
ceiling.rotation.x = Math.PI / 2; ceiling.position.set(0, HALL_H, HALL_Z);
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_H), wallMat);
backWall.position.set(0, HALL_H / 2, HALL_Z - HALL_L / 2);
[leftWall, rightWall, ceiling, backWall].forEach(m => scene.add(freeze(m)));

// safety lines
const lineMat = new THREE.MeshBasicMaterial({ color: 0xf2c230 });
for (const x of [-2.2, 2.2]) {
  const l = new THREE.Mesh(new THREE.PlaneGeometry(0.09, HALL_L), lineMat);
  l.rotation.x = -Math.PI / 2; l.position.set(x, 0.005, HALL_Z); scene.add(freeze(l));
}

// lockers (one instanced draw call)
const LOCKERS = 31;
const lockers = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 1.9, 0.6), lam({ map: lockerTex }), LOCKERS);
const lockerCols = [new THREE.Color(0xf08a4b), new THREE.Color(0x52b3a8), new THREE.Color(0xf08a4b), new THREE.Color(0xe7c14a)];
const m4 = new THREE.Matrix4();
for (let i = 0; i < LOCKERS; i++) {
  m4.makeRotationY(Math.PI / 2).setPosition(-2.74, 0.95, -0.6 - i * 0.62);
  lockers.setMatrixAt(i, m4); lockers.setColorAt(i, lockerCols[i % 4]);
}
lockers.castShadow = true; lockers.receiveShadow = true;
scene.add(freeze(lockers));

// doors, board, posters
function wallPlane(tex, w, h, side, z, y, basic) {
  const mat = basic ? new THREE.MeshBasicMaterial({ map: tex }) : lam({ map: tex });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
  m.position.set(side * (HALL_W / 2 - 0.01), y, z); m.receiveShadow = !basic;
  scene.add(freeze(m)); return m;
}
wallPlane(doorTex('B-12'), 1.1, 2.2, 1, -1.6, 1.1);
wallPlane(doorTex('B-14'), 1.1, 2.2, 1, -11.5, 1.1);
wallPlane(doorTex('B-16'), 1.1, 2.2, 1, -17.5, 1.1);
wallPlane(boardTex, 2.0, 1.25, 1, -14.4, 1.75);
wallPlane(posterTex('#ff6f61', '#fff3d6', 'READ!'), 0.75, 1.05, -1, -7.2, 2.75);
wallPlane(posterTex('#4d6fd1', '#ffd36b', 'TEAM'), 0.75, 1.05, -1, -13.2, 2.75);
const backDoor = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.4), lam({ map: doorTex('EXIT') }));
backDoor.position.set(0, 1.2, HALL_Z - HALL_L / 2 + 0.01); scene.add(freeze(backDoor));

// window (self-lit) on the right wall
const WIN_Z = -8, WIN_W = 3, WIN_Y0 = 1.4, WIN_Y1 = 3.2;
const win = wallPlane(windowTex, WIN_W, WIN_Y1 - WIN_Y0, 1, WIN_Z, (WIN_Y0 + WIN_Y1) / 2, true);
win.material.color.setScalar(1.25); win.material.fog = false;
const sill = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, WIN_W + 0.2), lam({ color: 0xd8cfbf }));
sill.position.set(2.9, WIN_Y0 - 0.04, WIN_Z); sill.castShadow = true; scene.add(freeze(sill));

// wall clock with moving hands (environment animation)
const clock = new THREE.Group();
clock.position.set(-2.98, 3.0, -3.2); clock.rotation.y = Math.PI / 2;
clock.add(new THREE.Mesh(new THREE.CircleGeometry(0.28, 24), lam({ map: clockTex })));
function hand(len, w) {
  const geo = new THREE.PlaneGeometry(w, len); geo.translate(0, len / 2, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: handTex, transparent: true }));
  m.position.z = 0.01; clock.add(m); return m;
}
const minuteHand = hand(0.21, 0.03), hourHand = hand(0.14, 0.04);
scene.add(clock);

// bench, plant, mop bucket
const greyMat = lam({ color: 0x7c7f8f });
const bench = new THREE.Group();
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.07, 1.5), lam({ color: 0xb5793f })); seat.position.y = 0.45;
bench.add(seat);
for (const z of [-0.6, 0.6]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.05), greyMat); leg.position.set(0, 0.22, z); bench.add(leg); }
bench.position.set(2.6, 0, -4.4);
bench.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(bench);

const plant = new THREE.Group();
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 0.42, 12), lam({ color: 0xc8643c })); pot.position.y = 0.21; plant.add(pot);
const leafMat = lam({ color: 0x3f9a4f });
const leaves = [];
for (let i = 0; i < 6; i++) {
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.7, 5), leafMat);
  const a = i / 6 * Math.PI * 2;
  leaf.position.set(Math.cos(a) * 0.08, 0.72, Math.sin(a) * 0.08);
  leaf.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
  leaf.userData.base = leaf.rotation.clone(); leaf.userData.a = a;
  plant.add(leaf); leaves.push(leaf);
}
plant.position.set(2.55, 0, -6.1);
plant.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(plant);

const bucket = new THREE.Group();
const pail = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.2, 0.36, 14), lam({ color: 0xf2c230 })); pail.position.y = 0.18; bucket.add(pail);
const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.5, 6), lam({ color: 0x9a6a3c }));
stick.position.set(0.05, 0.8, 0); stick.rotation.z = -0.22; bucket.add(stick);
bucket.position.set(-2.05, 0, -9.3);
bucket.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(bucket);

// ceiling fluorescent fixtures (instanced) + one flickering fixture
const tubeGeo = new THREE.BoxGeometry(0.3, 0.06, 1.3);
const tubeZ = [1, -7, -11, -15, -19, -23];
const tubes = new THREE.InstancedMesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0xeef6ff }), tubeZ.length);
tubeZ.forEach((z, i) => { m4.makeTranslation(0, HALL_H - 0.04, z); tubes.setMatrixAt(i, m4); });
scene.add(freeze(tubes));
const flickerTube = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0xeef6ff }));
flickerTube.position.set(0, HALL_H - 0.04, -3); scene.add(freeze(flickerTube));

// hanging sign that swings
const signPivot = new THREE.Group(); signPivot.position.set(0, HALL_H, -5.6);
const wireMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
for (const x of [-0.5, 0.5]) { const wire = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.6, 0.015), wireMat); wire.position.set(x, -0.3, 0); signPivot.add(wire); }
const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.4), lam({ map: signTex, side: THREE.DoubleSide }));
sign.position.y = -0.8; sign.castShadow = true; signPivot.add(sign);
scene.add(signPivot);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xc7d6ff, 0x3a2e4a, 1.5);
scene.add(hemi);

// Warm low sun from the window side; one shadow-casting light keeps the GPU cost down.
const SUN_DIR = new THREE.Vector3(5, 6, 6).normalize();
const sun = new THREE.DirectionalLight(0xffb27a, 2.6);
sun.target.position.set(0, 0, -6);
sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 32 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const tubeLightA = new THREE.PointLight(0xe8f3ff, 5, 8, 1.2); tubeLightA.position.set(0, 3.6, -3);
const tubeLightB = new THREE.PointLight(0xe8f3ff, 4, 8, 1.2); tubeLightB.position.set(0, 3.6, -11);
scene.add(tubeLightA, tubeLightB);

// fake volumetric light shafts through the window (additive, no extra lights)
const shaftMat = new THREE.MeshBasicMaterial({ map: shaftTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: 0.14 });
function shaftQuad(yWin) {
  const t = yWin / SUN_DIR.y; // distance along -SUN_DIR to reach the floor
  const fx = 2.98 - SUN_DIR.x * t, fz = -SUN_DIR.z * t;
  const z0 = WIN_Z - WIN_W / 2, z1 = WIN_Z + WIN_W / 2;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([
    2.98, yWin, z0, 2.98, yWin, z1, fx, 0.01, z1 + fz, fx, 0.01, z0 + fz], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
  geo.setIndex([0, 1, 2, 0, 2, 3]);
  return new THREE.Mesh(geo, shaftMat);
}
const shafts = new THREE.Group();
[3.1, 2.6, 2.1, 1.6].forEach(y => shafts.add(shaftQuad(y)));
scene.add(shafts);

// sunlit stripes on the floor where the shafts land
const patch = (() => {
  const tTop = WIN_Y1 / SUN_DIR.y, tBot = WIN_Y0 / SUN_DIR.y;
  const z0 = WIN_Z - WIN_W / 2, z1 = WIN_Z + WIN_W / 2;
  const p = (t, z) => [2.98 - SUN_DIR.x * t, 0.012, z - SUN_DIR.z * t];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([...p(tBot, z0), ...p(tBot, z1), ...p(tTop, z1), ...p(tTop, z0)], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  geo.setIndex([0, 1, 2, 0, 2, 3]);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: patchTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 }));
})();
scene.add(patch);

// dust motes drifting in the sunlight (one draw call)
const DUST = 220;
const dustPos = new Float32Array(DUST * 3), dustSeed = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) {
  dustSeed[i * 3] = rnd() * 3 - 0.2; dustSeed[i * 3 + 1] = 0.2 + rnd() * 3; dustSeed[i * 3 + 2] = -12.5 + rnd() * 6.5;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ map: dotTex, size: 0.045, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffe2b0 }));
dust.frustumCulled = false;
scene.add(dust);

/* ================================================================
   Character: flat ink illustration rigged in 3D
   ================================================================ */
const charMats = [];
function card(tex, w, h, pivotTop) {
  const geo = new THREE.PlaneGeometry(w, h);
  if (pivotTop) geo.translate(0, -h / 2, 0);
  const mat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, toneMapped: false });
  charMats.push(mat);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
  return m;
}
const HIP = 0.8;
const char = new THREE.Group();              // world position + billboard yaw
const body = new THREE.Group(); char.add(body); // bob + squash
const legL = card(legTex, 0.2, 0.8, true); legL.position.set(-0.075, HIP, -0.006);
const legR = card(legTex, 0.2, 0.8, true); legR.position.set(0.075, HIP, -0.006);
const upper = new THREE.Group(); upper.position.y = HIP;
const torso = card(torsoTex, 0.6, 0.6); torso.position.y = 0.27;
const headPivot = new THREE.Group(); headPivot.position.y = 0.55;
const head = card(HEAD.open, 0.74, 0.74); head.position.set(0, 0.26, 0.006);
headPivot.add(head);
const armL = card(armTex, 0.15, 0.6, true); armL.position.set(-0.15, 0.48, 0.012);
const armR = card(armTex, 0.15, 0.6, true); armR.position.set(0.15, 0.48, 0.012);
upper.add(torso, headPivot, armL, armR);
body.add(legL, legR, upper);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.008; char.add(blob);
scene.add(char);

/* ================================================================
   Timeline (deterministic: everything is a function of t)
   ================================================================ */
const camCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.35, 0.4, -5.9),   // low wide angle, character far down the hall
  new THREE.Vector3(-0.35, 0.85, -2.6), // dolly back while tracking
  new THREE.Vector3(1.6, 1.5, 0.3),     // arc across: perspective change
  new THREE.Vector3(0.7, 1.35, -0.3),   // push in to medium shot
], false, 'centripetal');
const camPos = new THREE.Vector3(), lookAt = new THREE.Vector3(), tmp = new THREE.Color();
const WALK_END = 3.2;

function flicker(t) {
  if (t > 3.55 && t < 4.0) { const s = Math.floor(t * 40); return (s * 7919 % 5) < 2 ? 0.2 : 1; }
  return 0.94 + 0.06 * Math.sin(t * 50) * Math.sin(t * 7.3);
}

function update(t) {
  /* --- character --- */
  const s = Math.min(t / WALK_END, 1);
  const f = 1 - Math.pow(1 - s, 1.6);
  char.position.set(0.9 - 0.75 * f, 0, -11 + 7.6 * f);
  const phase = (7.64 * f) * Math.PI * 2 / 1.15;
  const w = smooth((WALK_END - t) / 0.4);
  const sn = Math.sin(phase);
  const liftL = Math.max(0, sn), liftR = Math.max(0, -sn);
  legL.scale.y = 1 - 0.16 * liftL * w; legL.rotation.z = -0.06 * liftL * w;
  legR.scale.y = 1 - 0.16 * liftR * w; legR.rotation.z = 0.06 * liftR * w;
  body.position.y = 0.03 * (Math.abs(Math.cos(phase)) - 1) * w;
  upper.rotation.z = sn * 0.045 * w;
  headPivot.rotation.z = -sn * 0.05 * w;
  armL.rotation.z = -0.14 - sn * 0.22 * w;
  armR.rotation.z = 0.14 - sn * 0.22 * w;
  // stop: squash and settle
  const k = (t > 3.1 && t < 3.55) ? Math.sin(Math.PI * (t - 3.1) / 0.45) : 0;
  body.scale.set(1 + 0.05 * k, 1 - 0.07 * k, 1);
  upper.scale.y = 1 + 0.015 * Math.sin(t * 4) * (1 - w); // idle breathing
  // wave
  const wv = smooth((t - 3.4) / 0.35);
  armR.rotation.z = lerp(armR.rotation.z, 2.45 + Math.sin((t - 3.4) * 12) * 0.35, wv);
  armL.rotation.z = lerp(armL.rotation.z, -0.35, wv);
  headPivot.rotation.z += 0.12 * wv + 0.03 * Math.sin(t * 6) * wv;
  // face
  const blink = (t > 1.0 && t < 1.12) || (t > 2.4 && t < 2.5);
  const face = t > 3.45 ? HEAD.happy : blink ? HEAD.blink : HEAD.open;
  if (head.material.map !== face) head.material.map = face;

  /* --- camera --- */
  const u = 0.45 * (t / DURATION) + 0.55 * smooth(t / DURATION);
  camCurve.getPoint(u, camPos);
  const shake = 0.008 + 0.01 * smooth((t - 3.2) / 0.5);
  camPos.x += Math.sin(t * 3.1) * shake; camPos.y += Math.sin(t * 4.3 + 1) * shake;
  camera.position.copy(camPos);
  camera.fov = t < 1.5 ? 50 : t < 3.2 ? lerp(50, 44, smooth((t - 1.5) / 1.7)) : lerp(44, 46, smooth((t - 3.2) / 1.8));
  camera.updateProjectionMatrix();
  lookAt.set(char.position.x + 0.12 * wv, lerp(1.1, 1.38, smooth(t / DURATION)), char.position.z);
  camera.lookAt(lookAt);

  // billboard: character card always faces the camera (yaw only)
  char.rotation.y = Math.atan2(camera.position.x - char.position.x, camera.position.z - char.position.z);

  /* --- environment --- */
  const fl = flicker(t);
  flickerTube.material.color.setRGB(0.93 * fl, 0.96 * fl, fl);
  tubeLightA.intensity = 5 * fl;
  signPivot.rotation.x = 0.14 * Math.sin(t * 2.4 + 0.3);
  signPivot.rotation.z = 0.03 * Math.sin(t * 1.7);
  minuteHand.rotation.z = -t * 2.4; hourHand.rotation.z = -t * 0.2 - 1.2;
  shaftMat.opacity = 0.12 + 0.04 * Math.sin(t * 1.3);
  patch.material.opacity = 0.45 + 0.1 * Math.sin(t * 1.3);
  leaves.forEach(l => { l.rotation.z = l.userData.base.z + 0.05 * Math.sin(t * 2 + l.userData.a); });
  for (let i = 0; i < DUST; i++) {
    const a = dustSeed[i * 3], b = dustSeed[i * 3 + 1], c = dustSeed[i * 3 + 2];
    dustPos[i * 3] = a + 0.08 * Math.sin(t * 0.7 + i);
    dustPos[i * 3 + 1] = b + 0.06 * Math.sin(t * 0.5 + i * 1.7) + t * 0.03;
    dustPos[i * 3 + 2] = c + 0.08 * Math.cos(t * 0.6 + i * 0.3);
  }
  dustGeo.attributes.position.needsUpdate = true;

  // character lighting: warm while in the sun stripes, dims with the flicker
  const inSun = smooth(1 - Math.abs(char.position.z + 9.3) / 2.2);
  const dim = lerp(1, fl, smooth((t - 2.8) / 0.4));
  tmp.setRGB(1, 1 - 0.07 * inSun, 1 - 0.16 * inSun).multiplyScalar(0.8 + 0.2 * dim);
  charMats.forEach(m => m.color.copy(tmp));
}

/* ================================================================
   Playback, benchmark & adaptive resolution
   ================================================================ */
let t = 0, playing = false, finished = false, last = 0;
const frameMs = [];
let dpr = MAX_DPR, accMs = 0, accN = 0, dprDrops = 0;
let hudOn = true, hudTimer = 0, fpsAcc = 0, fpsN = 0, liveFps = 0, liveMs = 0;
const gpuName = (() => {
  try {
    const gl = renderer.getContext(); const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (e) { return 'unknown'; }
})();

function adapt(ms) {
  accMs += ms; accN++;
  if (accN >= 30) {
    if (accMs / accN > 20 && dpr > 1) { dpr = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dpr); dprDrops++; }
    accMs = 0; accN = 0;
  }
}

function drawHud(ms) {
  if (ms > 0) { fpsAcc += ms; fpsN++; }
  hudTimer += ms;
  if (hudTimer < 250 && ms > 0) return;
  if (fpsN) { liveMs = fpsAcc / fpsN; liveFps = 1000 / liveMs; }
  fpsAcc = 0; fpsN = 0; hudTimer = 0;
  if (!hudOn) return;
  const info = renderer.info.render;
  hudEl.textContent =
    `FPS   ${liveFps ? liveFps.toFixed(0) : '--'}  (${liveMs ? liveMs.toFixed(1) : '--'} ms)\n` +
    `t     ${t.toFixed(2)} / ${DURATION.toFixed(1)} s\n` +
    `DPR   ${dpr.toFixed(2)}  ${renderer.domElement.width}x${renderer.domElement.height}\n` +
    `calls ${info.calls}   tris ${info.triangles}`;
}

function frame(now) {
  const ms = last ? Math.min(now - last, 100) : 0;
  last = now;
  if (ms > 0) { frameMs.push(ms); adapt(ms); }
  t = Math.min(DURATION, t + ms / 1000);
  update(t);
  renderer.render(scene, camera);
  drawHud(ms);
  if (t >= DURATION) finish();
}

function play() {
  if (finished) reset();
  playing = true; last = 0;
  titleEl.style.opacity = 0; summaryEl.style.display = 'none';
  playBtn.textContent = '❚❚ Pause';
  renderer.setAnimationLoop(frame);
}
function pause() {
  playing = false; renderer.setAnimationLoop(null);
  playBtn.textContent = finished ? '▶ Replay' : (t > 0 ? '▶ Resume' : '▶ Start');
}
function reset() {
  t = 0; finished = false; frameMs.length = 0;
  update(0); renderer.render(scene, camera); drawHud(0);
}
function finish() {
  finished = true; pause();
  const n = frameMs.length;
  if (!n) return;
  const total = frameMs.reduce((a, b) => a + b, 0);
  const sorted = [...frameMs].sort((a, b) => b - a);
  const worstN = Math.max(1, Math.floor(n * 0.01));
  const low1 = 1000 / (sorted.slice(0, worstN).reduce((a, b) => a + b, 0) / worstN);
  const avg = n / (total / 1000);
  const grade = avg >= 55 ? 'Excellent — room for more detail' : avg >= 40 ? 'Good — smooth on this device' : avg >= 28 ? 'OK — consider lighter scenes' : 'Heavy — reduce detail or resolution';
  summaryEl.innerHTML = `<b>Benchmark result</b>\n` +
    `Average FPS  ${avg.toFixed(1)}\n` +
    `1% low FPS   ${low1.toFixed(1)}\n` +
    `Worst frame  ${sorted[0].toFixed(1)} ms\n` +
    `Frames       ${n} in ${(total / 1000).toFixed(2)} s\n` +
    `Final DPR    ${dpr.toFixed(2)} (${dprDrops} auto drops)\n` +
    `GPU          ${gpuName}\n` +
    `Verdict      ${grade}`;
  summaryEl.style.display = 'block';
}

playBtn.addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('restart').addEventListener('click', () => { const was = playing; pause(); reset(); finished = false; if (was) play(); else pause(); });
document.getElementById('hudBtn').addEventListener('click', () => { hudOn = !hudOn; hudEl.style.display = hudOn ? 'block' : 'none'; drawHud(0); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); pause(); showMsg('The GPU reset the page (WebGL context lost). Reload to try again.'); });

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.floor(Math.min(vw, vh * 9 / 16)), h = Math.floor(w * 16 / 9);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!playing) { update(t); renderer.render(scene, camera); drawHud(0); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// warm up: compile shaders and upload textures before the timed run
resize();
renderer.compile(scene, camera);
reset();
playBtn.disabled = false;
// QA hooks (used by qa/capture.js): jump to any time and render that exact frame
window.__duration = DURATION;
window.__seek = (time) => { pause(); t = Math.max(0, Math.min(DURATION, time)); update(t); renderer.render(scene, camera); drawHud(0); };
window.__ready = true;
</script>
</body>
</html>
