<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06121c">
<title>The Ancient Computer Found Underwater — part 1</title>
<style>
  :root { --bg:#06121c; --ink:#f6f1e7; --accent:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#0b2a3c; }
  #stage canvas { display:block; }
  #vignette { position:absolute; inset:0; pointer-events:none; display:none; background:radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(5,4,15,.45) 100%); }
  #cap { display:none; }
  #hud { position:absolute; top:10px; left:10px; padding:6px 8px; border-radius:6px; display:none; font:11px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre; background:rgba(0,0,0,.55); pointer-events:none; }
  #title { position:absolute; top:12%; left:0; right:0; text-align:center; pointer-events:none; transition:opacity .4s; text-shadow:0 2px 12px rgba(0,0,0,.7); padding:0 16px; }
  #title h1 { font-size:24px; font-weight:900; letter-spacing:.03em; line-height:1.2; }
  #title p { font-size:14px; margin-top:6px; opacity:.9; }
  #prep { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; background:#06121c; font-size:15px; line-height:1.6; padding:24px; transition:opacity .35s; }
  #summary { position:absolute; left:14px; right:14px; bottom:84px; display:none; padding:10px 14px; background:rgba(12,9,20,.92); border:1px solid rgba(255,255,255,.16); border-radius:12px; font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; }
  #summary b { color:var(--accent); font-family:system-ui,sans-serif; font-size:15px; }
  #controls { position:absolute; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  button { font:700 16px system-ui,sans-serif; border:0; border-radius:999px; min-height:48px; padding:0 22px; background:var(--accent); color:#1a1208; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  button.ghost { background:rgba(20,20,30,.5); color:var(--ink); padding:0 14px; font-size:14px; }
  #quality { display:none; }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; background:rgba(0,0,0,.85); font-size:15px; line-height:1.5; }
</style>
</head>
<body>
<div id="stage">
  <div id="vignette"></div><div id="cap"></div><div id="hud"></div>
  <div id="title"><h1>THE ANCIENT COMPUTER<br>FOUND UNDERWATER</h1><p>Part 1 · tap Start (sound on)</p></div>
  <div id="summary"></div>
  <div id="controls">
    <button id="play" disabled>▶ Start</button>
    <button id="restart" class="ghost">↺</button>
    <button id="sound" class="ghost">🔊</button>
    <button id="hudBtn" class="ghost">HUD</button>
    <button id="quality" class="ghost">Q</button>
  </div>
  <div id="prep">Preparing the scene…<br><small>building the sets · checking what your phone can handle</small></div>
  <div id="msg"></div>
</div>
<script>
  function showMsg(t){ var m=document.getElementById('msg'); m.textContent=t; m.style.display='flex'; }
  window.addEventListener('error', function(e){ showMsg('Error: ' + (e.message || 'a script failed to load')); });
  window.addEventListener('unhandledrejection', function(e){ showMsg('Error: ' + (e.reason && e.reason.message || e.reason)); });
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
