<style>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Stage, installGrade, Sound, synth } from '../../lib/stage.js';

const A = '../../assets/polyhaven';
const DURATION = 10;
installGrade({ warm: [.97, 1.0, 1.12], saturation: 1.55, lift: [.004, .008, .03], contrast: 1.04 });
const stage = new Stage({ duration: DURATION, near: .03, far: 40 });
const { scene, camera, renderer } = stage;
scene.background = new THREE.Color('#07060c');
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; }

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, fa = .25, fb = .25) => smooth((t - a) / fa) * (1 - smooth((t - b) / fb));
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const std = (o) => new THREE.MeshStandardMaterial(o);

/* =====================================================================
   1. Room: plaster walls, dark wood wainscot, worn wood floor, beams
   ===================================================================== */
const ROOM = { x0: -2.6, x1: 2.6, z0: -4.0, z1: 1.6, h: 3.0 };
const floorMat = pbr(A + '/tex', 'old_wood_floor', { repeat: [3, 3] });
const plaster = pbr(A + '/tex', 'plastered_wall_04', { repeat: [2.5, 1.5], color: 0xe9dcc8 });
const planks = pbr(A + '/tex', 'dark_wooden_planks', { repeat: [3, 1] });
const planksV = pbr(A + '/tex', 'dark_wooden_planks', { repeat: [1, 2] });
function quad(w, h, mat) { const g = new THREE.PlaneGeometry(w, h); g.setAttribute('uv1', g.attributes.uv); const m = new THREE.Mesh(g, mat); m.receiveShadow = true; return m; }
{
  const W = ROOM.x1 - ROOM.x0, D = ROOM.z1 - ROOM.z0;
  const fl = quad(W, D, floorMat); fl.rotation.x = -Math.PI / 2; fl.position.set(0, 0, (ROOM.z0 + ROOM.z1) / 2); scene.add(fl);
  const ce = quad(W, D, planks); ce.rotation.x = Math.PI / 2; ce.position.set(0, ROOM.h, (ROOM.z0 + ROOM.z1) / 2); scene.add(ce);
  const walls = [[W, 0, ROOM.z0, 0, (ROOM.x0 + ROOM.x1) / 2], [D, Math.PI / 2, (ROOM.z0 + ROOM.z1) / 2, ROOM.x0, null], [D, -Math.PI / 2, (ROOM.z0 + ROOM.z1) / 2, ROOM.x1, null]];
  for (const [len, ry, c, x, xc] of walls) {
    const up = quad(len, ROOM.h - 1.1, plaster), lo = quad(len, 1.1, planks), rail = new THREE.Mesh(new THREE.BoxGeometry(len, .07, .05), planksV);
    for (const [m, y] of [[up, 1.1 + (ROOM.h - 1.1) / 2], [lo, .55], [rail, 1.12]]) {
      m.rotation.y = ry; if (xc !== null) m.position.set(xc, y, c); else m.position.set(x, y, c);
      m.receiveShadow = true; scene.add(m);
    }
  }
  // ceiling beams
  for (let i = 0; i < 5; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(W, .16, .14), planksV); b.position.set(0, ROOM.h - .08, ROOM.z0 + .6 + i * 1.15); b.castShadow = true; scene.add(b); }
  // doorway frame at the front (foreground in the opening shot)
  for (const x of [-1.15, 1.15]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.16, ROOM.h, .2), planksV); p.position.set(x, ROOM.h / 2, ROOM.z1 - .1); scene.add(p); }
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(2.46, .3, .2), planksV); lintel.position.set(0, 2.35, ROOM.z1 - .1); scene.add(lintel);
}

/* ---------- window with the night street outside (left wall) ---------- */
const WIN = { z: -2.35, y: 1.75, w: 1.15, h: 1.15 };
{
  const night = canvasTex(512, 512, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#0b1433'); sky.addColorStop(.6, '#1d2f63'); sky.addColorStop(1, '#3a3f6e');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${.3 + Math.random() * .6})`; g.fillRect(Math.random() * w, Math.random() * h * .55, 2, 2); }
    const moon = g.createRadialGradient(140, 110, 10, 140, 110, 90); moon.addColorStop(0, 'rgba(235,240,255,1)'); moon.addColorStop(.35, 'rgba(200,215,255,.5)'); moon.addColorStop(1, 'rgba(120,140,220,0)');
    g.fillStyle = moon; g.fillRect(0, 0, w, h); g.fillStyle = '#f2f4ff'; g.beginPath(); g.arc(140, 110, 30, 0, 7); g.fill();
    g.fillStyle = '#0d0f1f'; let x = -10; while (x < w) { const bw = 60 + Math.random() * 70, bh = 120 + Math.random() * 140; g.fillRect(x, h - bh, bw, bh);
      g.beginPath(); g.moveTo(x - 6, h - bh); g.lineTo(x + bw / 2, h - bh - 40); g.lineTo(x + bw + 6, h - bh); g.fill();
      for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) if (Math.random() < .35) { g.fillStyle = '#ffcf7a'; g.fillRect(x + 10 + c * 20, h - bh + 20 + r * 26, 10, 14); g.fillStyle = '#0d0f1f'; }
      x += bw + 8; }
    const lamp = g.createRadialGradient(380, 330, 4, 380, 330, 120); lamp.addColorStop(0, 'rgba(255,214,140,1)'); lamp.addColorStop(.2, 'rgba(255,180,90,.45)'); lamp.addColorStop(1, 'rgba(255,160,80,0)');
    g.fillStyle = lamp; g.fillRect(0, 0, w, h); g.fillStyle = '#121320'; g.fillRect(376, 330, 8, 190);
  });
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w, WIN.h), new THREE.MeshBasicMaterial({ map: night, color: new THREE.Color(1.6, 1.6, 1.8) }));
  glass.rotation.y = Math.PI / 2; glass.position.set(ROOM.x0 + .015, WIN.y, WIN.z); scene.add(glass);
  const frameM = planksV;
  const parts = [[WIN.w + .16, .1, 0, WIN.h / 2 + .03], [WIN.w + .3, .12, 0, -WIN.h / 2 - .04], [.08, WIN.h, -WIN.w / 2 - .04, 0], [.08, WIN.h, WIN.w / 2 + .04, 0], [.05, WIN.h, 0, 0], [WIN.w, .05, 0, 0]];
  for (const [w, h, x, y] of parts) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, .09), frameM); b.rotation.y = Math.PI / 2; b.position.set(ROOM.x0 + .045, WIN.y + y, WIN.z + x); b.castShadow = true; scene.add(b); }
  const sill = new THREE.Mesh(new THREE.BoxGeometry(.24, .05, WIN.w + .3), frameM); sill.position.set(ROOM.x0 + .12, WIN.y - WIN.h / 2 - .06, WIN.z); sill.castShadow = true; scene.add(sill);
}

/* =====================================================================
   2. Props (Poly Haven, CC0) — placed in metres
   ===================================================================== */
const BENCH = V(0, 0, -1.55), BENCH_TOP = .83;
const MAT_Y = BENCH_TOP + .004;
async function place(name, pos, ry = 0, s = 1) { const o = await prop(`${A}/${name}.glb`); o.position.copy(pos); o.rotation.y = ry; o.scale.setScalar(s); scene.add(o); return o; }
const props = {};
async function buildProps() {
  props.bench = await place('WoodenTable_03', BENCH, 0);
  props.lamp = await place('desk_lamp_arm_01', V(-.64, BENCH_TOP, -1.5), Math.PI / 2);
  props.shelf = await place('wooden_bookshelf_worn', V(-1.4, 0, -3.68), 0);
  props.grand = await place('vintage_grandfather_clock_01', V(1.55, 0, -3.62), 0);
  props.cab = await place('vintage_wooden_drawer_01', V(2.12, 0, -2.0), -Math.PI / 2);
  props.oil = await place('vintage_oil_lamp', V(2.0, 1.01, -2.55), 0);
  props.vase = await place('brass_vase_01', V(2.05, 1.01, -1.6), 0);
  props.mantel = await place('mantel_clock_01', V(2.1, 1.01, -2.05), -Math.PI / 2);
  props.alarm1 = await place('alarm_clock_01', V(.52, BENCH_TOP, -1.36), -.35);
  props.alarm2 = await place('alarm_clock_01', V(-1.35, 1.3, -3.62), .2, .9);
  props.alarm3 = await place('alarm_clock_01', V(-1.65, .82, -3.6), -.3, .9);
  props.wall1 = await place('wall_clock', V(-.45, 2.2, ROOM.z0 + .03), 0, 1.0);
  props.wall2 = await place('wall_clock', V(ROOM.x1 - .03, 2.15, -2.9), -Math.PI / 2, 1.2);
  props.frame = await place('hanging_picture_frame_01', V(ROOM.x1 - .03, 1.8, -1.2), -Math.PI / 2, .9);
  props.screw = await place('screwdriver', V(.42, MAT_Y, -1.36), 1.2);
  props.pliers = await place('pliers', V(-.28, MAT_Y, -1.34), -.6);
  // clocks stand upright facing the room: Poly Haven models are authored Z-up in Blender, glTF is Y-up already.
}

/* ---------- pendulum wall clocks (built in code: they are the story) ---------- */
const pendulums = [];
function pendulumClock(pos, scale, numeralColor) {
  const G = new THREE.Group();
  const wood = planksV, brass = std({ color: '#d1a44a', metalness: 1, roughness: .28 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.36, .95, .1), wood); body.position.y = -.2; body.castShadow = true; G.add(body);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .1, 32, 1, false, 0, Math.PI), wood); crown.rotation.z = Math.PI / 2; crown.rotation.y = Math.PI / 2; crown.position.set(0, .27, 0); G.add(crown);
  const dial = new THREE.Mesh(new THREE.CircleGeometry(.14, 40), new THREE.MeshStandardMaterial({ map: canvasTex(256, 256, (g) => {
    g.fillStyle = '#f4ead2'; g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill(); g.strokeStyle = '#2a1d14'; g.lineWidth = 6; g.stroke();
    g.fillStyle = numeralColor; g.font = 'bold 30px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    ['XII', 'III', 'VI', 'IX'].forEach((n, i) => { const a = i * Math.PI / 2; g.fillText(n, 128 + Math.sin(a) * 92, 128 - Math.cos(a) * 92); });
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r1 = i % 5 ? 112 : 104; g.fillRect(128 + Math.sin(a) * r1 - 1.5, 128 - Math.cos(a) * r1 - 1.5, 3, 3); }
  }), roughness: .6 }));
  dial.position.set(0, .12, .052); G.add(dial);
  const handM = std({ color: '#1a1410', roughness: .5 });
  const hh = new THREE.Mesh(new THREE.BoxGeometry(.012, .07, .004), handM); hh.geometry.translate(0, .035, 0); hh.position.set(0, .12, .056); hh.rotation.z = -1.1; G.add(hh);
  const mh = new THREE.Mesh(new THREE.BoxGeometry(.008, .11, .004), handM); mh.geometry.translate(0, .055, 0); mh.position.set(0, .12, .058); mh.rotation.z = .5; G.add(mh);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.142, .012, 10, 48), brass); ring.position.set(0, .12, .052); G.add(ring);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(.26, .5), std({ color: '#2a1a12', roughness: .9 })); back.position.set(0, -.33, .051); G.add(back);
  const piv = new THREE.Group(); piv.position.set(0, -.08, .06); G.add(piv);
  const rod = new THREE.Mesh(new THREE.BoxGeometry(.008, .42, .004), brass); rod.position.y = -.21; piv.add(rod);
  const bob = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .012, 32), brass); bob.rotation.x = Math.PI / 2; bob.position.y = -.42; piv.add(bob);
  const glassFrame = new THREE.Mesh(new THREE.TorusGeometry(.16, .01, 6, 4, Math.PI * 2), wood); glassFrame.rotation.z = Math.PI / 4; glassFrame.scale.set(.9, 1.7, 1); glassFrame.position.set(0, -.33, .06); G.add(glassFrame);
  G.position.copy(pos); G.scale.setScalar(scale); scene.add(G);
  return { G, piv, mh, hh };
}
pendulums.push({ ...pendulumClock(V(.25, 2.05, ROOM.z0 + .06), 1.0, '#2a1d14'), start: 6.9, period: 1.0, amp: .2 });
pendulums.push({ ...pendulumClock(V(.85, 1.8, ROOM.z0 + .06), .78, '#7a2a1a'), start: 7.2, period: .78, amp: .24 });
pendulums.push({ ...pendulumClock(V(-2.53, 1.9, -1.05), .85, '#2a1d14'), start: 7.45, period: .9, amp: .22 });
pendulums[2].G.rotation.y = Math.PI / 2;

/* ---------- books on the shelf (instanced) ---------- */
{
  const g = new THREE.BoxGeometry(1, 1, 1); g.translate(0, .5, 0);
  const N = 54, books = new THREE.InstancedMesh(g, std({ roughness: .75 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  const cols = ['#7a2a26', '#2f4f6e', '#c9a24a', '#3f6b46', '#5a3a6e', '#a8653a', '#ddd2b8', '#22323f'];
  let i = 0;
  for (const [y, x0, x1] of [[.46, -1.98, -.85], [.96, -1.98, -1.55], [1.46, -1.98, -1.1], [1.46, -1.0, -.82]]) {
    let x = x0;
    while (x < x1 && i < N) { const w = .03 + Math.random() * .03, h = .2 + Math.random() * .1, tilt = Math.random() < .12 ? .25 : 0;
      q.setFromAxisAngle(V(0, 0, 1), -tilt); m.compose(V(x + w / 2, y, -3.72 + Math.random() * .03), q, V(w, h, .17 + Math.random() * .04)); books.setMatrixAt(i, m); books.setColorAt(i, c.set(cols[i % cols.length])); i++; x += w + .004; }
  }
  books.count = i; books.castShadow = true; books.receiveShadow = true; scene.add(books);
}

/* ---------- foreground: pocket watches hanging on strings near the doorway ---------- */
const hanging = [];
function pocketWatchMesh(r = .045, gold = '#d4a64a') {
  const G = new THREE.Group();
  const goldM = std({ color: gold, metalness: 1, roughness: .26 });
  const prof = [V(0, -.006, 0), V(r * .96, -.006, 0), V(r, 0, 0), V(r * .96, .006, 0), V(0, .006, 0)].map(v => new THREE.Vector2(v.x, v.y));
  const caseM = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), goldM); caseM.rotation.x = Math.PI / 2; G.add(caseM);
  const bow = new THREE.Mesh(new THREE.TorusGeometry(r * .3, r * .06, 8, 24), goldM); bow.position.y = r * 1.25; G.add(bow);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(r * .12, r * .12, r * .14, 16), goldM); crown.position.y = r * 1.03; G.add(crown);
  return { G, goldM };
}
for (const [x, y, z, len, ph] of [[-.62, 2.2, 1.1, .5, 0], [.55, 2.35, 1.0, .38, 1.4], [-.15, 2.42, 1.25, .3, 2.6]]) {
  const piv = new THREE.Group(); piv.position.set(x, y, z); scene.add(piv);
  const str = new THREE.Mesh(new THREE.CylinderGeometry(.0025, .0025, len, 4), std({ color: '#3a2a1a' })); str.position.y = -len / 2; piv.add(str);
  const w = pocketWatchMesh(.05); w.G.position.y = -len - .06; w.G.rotation.y = ph; piv.add(w.G);
  hanging.push({ piv, ph, len });
}

/* =====================================================================
   3. Hero props: the open pocket watch with its gear train, the loose gear, tweezers, work mat
   ===================================================================== */
const WATCH0 = V(.08, MAT_Y + .006, -1.5);         // where the watch lies on the mat
const watch = new THREE.Group(); scene.add(watch);
const brassM = std({ color: '#d9b25a', metalness: 1, roughness: .32 }), steelM = std({ color: '#c9ced6', metalness: 1, roughness: .25 }), rubyM = std({ color: '#c0182a', roughness: .2, emissive: '#400008' });
function gearGeo(r, teeth, hole = .25, depth = .0016) {
  const s = new THREE.Shape(), ri = r * .82;
  for (let i = 0; i < teeth * 2; i++) { const a0 = i / (teeth * 2) * Math.PI * 2, a1 = (i + 1) / (teeth * 2) * Math.PI * 2, rr = i % 2 ? ri : r;
    if (i === 0) s.moveTo(Math.cos(a0) * rr, Math.sin(a0) * rr); s.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr); s.lineTo(Math.cos(a1) * rr, Math.sin(a1) * rr); }
  const h = new THREE.Path(); h.absarc(0, 0, r * hole, 0, Math.PI * 2, true); s.holes.push(h);
  for (let k = 0; k < 4; k++) { const p = new THREE.Path(), a = k * Math.PI / 2 + .4; p.absarc(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .16, 0, Math.PI * 2, true); s.holes.push(p); }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 6 }); g.rotateX(-Math.PI / 2); return g;
}
const watchGears = [];
let SLOT;      // local position where the hero gear seats
{
  const { G, goldM } = pocketWatchMesh(.05); G.rotation.x = -Math.PI / 2; G.rotation.z = Math.PI; watch.add(G);  // lying flat, crown toward the camera
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(.046, .046, .002, 48), brassM); plate.position.y = .0062; watch.add(plate);
  for (const [x, z, r, teeth, speed, m] of [[-.015, .01, .016, 20, .8, brassM], [.018, -.012, .011, 14, -1.3, steelM], [-.006, -.024, .008, 10, 2.1, brassM], [.02, .016, .009, 12, 0, brassM]]) {
    const g = new THREE.Mesh(gearGeo(r, teeth), m); g.position.set(x, .0075, z); watch.add(g); watchGears.push({ g, speed, r });
  }

  add(4.55, (c, o, w) => { synth.osc(c, o, 'square', 2400, w, .001, .08, .03); synth.osc(c, o, 'sine', 3600, w, .001, .1, .08); synth.noise(c, o, w, 'highpass', 5000, 1, .2, .03); });
  for (let t = 4.65; t < DURATION; t += .2) add(t, (c, o, w) => synth.noise(c, o, w, 'highpass', 6500, 2, t < 6.2 ? .05 : .09, .015));
  for (const p of pendulums) for (let t = p.start; t < DURATION; t += p.period / 2) { const f = p.period > .9 ? 900 : 1300; add(t, (c, o, w) => { synth.osc(c, o, 'sine', f, w, .001, .07, .05, f * .8); synth.noise(c, o, w, 'bandpass', f * 1.8, 3, .08, .03); }); }
  add(7.55, (c, o, w) => { for (let i = 0; i < 6; i++) synth.osc(c, o, 'triangle', 880 * Math.pow(2, i / 7), w + i * .03, .003, .03, .3); });
  add(8.2, (c, o, w) => { for (const f of [261.6, 329.6, 392, 493.9, 587.3]) synth.osc(c, o, 'triangle', f, w, .04, .05, 1.6); synth.osc(c, o, 'sine', 130.8, w, .05, .14, 1.8); });
  [[659.3, 8.3], [523.3, 8.75], [587.3, 9.2], [392, 9.65]].forEach(([f, t]) => add(t, (c, o, w) => synth.bell(c, o, f, w, .11, 1.8)));
  E.sort((a, b) => a.t - b.t); return E;
}

/* =====================================================================
   9. Boot
   ===================================================================== */
(async () => {
  const [art] = await Promise.all([buildAugustaArt(), buildProps()]);
  aug = new Character(scene, { art, dims: AUGUSTA_DIMS }, { scale: CS });
  // find the clock hands inside the Poly Haven models; each turns around its thinnest axis
  const addSpin = (root, name, start, rate, step) => { const o = node(root, name); if (!o || !o.geometry) return;
    o.geometry.computeBoundingBox(); const s = o.geometry.boundingBox.getSize(new THREE.Vector3());
    const axis = s.x < s.y && s.x < s.z ? V(1, 0, 0) : s.y < s.z ? V(0, 1, 0) : V(0, 0, 1);
    spin.push({ obj: o, base: o.quaternion.clone(), axis, start, rate, step }); };
  addSpin(props.wall1, 'wall_clock_second_hand', 7.0, 1, Math.PI / 30); addSpin(props.wall2, 'wall_clock_second_hand', 7.3, 1, Math.PI / 30);
  addSpin(props.alarm1, 'second_hand', 7.4, 1, Math.PI / 30); addSpin(props.alarm2, 'second_hand', 7.6, 1, Math.PI / 30); addSpin(props.alarm3, 'second_hand', 7.8, 1, Math.PI / 30);
  addSpin(props.grand, 'vintage_grandfather_clock_01_MinuteHand', 8.2, 1, Math.PI / 30);
  Sound.events = buildSound();
  stage.onUpdate = update;
  // performance: the moonlight shadow is a whole extra pass over the room — only on high quality
  stage.onQuality = (level) => { moon.castShadow = level === 'high'; };
  stage.onQuality(stage.quality);
  await stage.boot({ warmTimes: [0, 1.5, 3.2, 4.4, 5.8, 6.8, 7.6, 8.6, 9.6],
    beforeCompile: () => { tweezers.visible = heroGear.visible = watch.visible = true; } });
  window.__cam = (time) => { const s = path.at(time); return [s.pos.x, s.pos.y, s.pos.z]; };
  window.__roughness = () => path.roughness(30);
})();
