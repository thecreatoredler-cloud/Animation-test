<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a12">
<title>The Little Red Flag</title>
<style>
  :root { --bg:#0b0a12; --ink:#f6f1e7; --accent:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#7fb2ee; }
  #stage canvas { display:block; will-change:filter; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(10,8,30,.38) 100%); }
  #cap { position:absolute; left:0; right:0; top:61%; text-align:center; pointer-events:none;
    font:900 40px/1 "Arial Rounded MT Bold","Nunito",system-ui,sans-serif; letter-spacing:.01em; color:#fff;
    -webkit-text-stroke:7px #111; paint-order:stroke fill; text-shadow:0 4px 0 rgba(0,0,0,.35);
    transform-origin:50% 60%; white-space:nowrap; }
  #hud { position:absolute; top:10px; left:10px; padding:6px 8px; border-radius:6px; display:none;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre; background:rgba(0,0,0,.5); pointer-events:none; }
  #title { position:absolute; top:16%; left:0; right:0; text-align:center; pointer-events:none; transition:opacity .4s;
    text-shadow:0 2px 12px rgba(0,0,0,.55); }
  #title h1 { font-size:30px; font-weight:900; letter-spacing:.04em; }
  #title p { font-size:14px; margin-top:6px; opacity:.9; }
  #summary { position:absolute; left:14px; right:14px; bottom:84px; display:none; padding:10px 14px;
    background:rgba(12,9,20,.88); border:1px solid rgba(255,255,255,.16); border-radius:12px;
    font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; }
  #summary b { color:var(--accent); font-family:system-ui,sans-serif; font-size:15px; }
  #controls { position:absolute; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:8px; }
  button { font:700 16px system-ui,sans-serif; border:0; border-radius:999px; min-height:48px; padding:0 24px;
    background:var(--accent); color:#1a1208; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  button.ghost { background:rgba(20,20,30,.45); color:var(--ink); padding:0 15px; font-size:14px; backdrop-filter:blur(4px); }
  button:active { transform:scale(.96); }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
    text-align:center; background:rgba(0,0,0,.82); font-size:15px; line-height:1.5; }
</style>
</head>
<body>
<div id="stage">
  <div id="vignette"></div>
  <div id="cap"></div>
  <div id="hud"></div>
  <div id="title"><h1>THE LITTLE RED FLAG</h1><p>Test 01 · tap Start (sound on)</p></div>
  <div id="summary"></div>
  <div id="controls">
    <button id="play" disabled>▶ Start</button>
    <button id="restart" class="ghost">↺</button>
    <button id="sound" class="ghost">🔊</button>
    <button id="hudBtn" class="ghost">HUD</button>
  </div>
  <div id="msg"></div>
</div>

<script>
  function showMsg(t){ var m=document.getElementById('msg'); m.textContent=t; m.style.display='flex'; }
  window.addEventListener('error', function(e){ showMsg('Error: ' + (e.message || 'a script failed to load')); });
  setTimeout(function(){ if(!window.__ready) showMsg('Could not start. Check the connection (Three.js loads from cdn.jsdelivr.net) and that WebGL is on.'); }, 15000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   0. Renderer, grading, helpers
   ===================================================================== */
const DURATION = 15.0;
const INK = '#1d1418';
const stage = document.getElementById('stage');
const capEl = document.getElementById('cap');
const hudEl = document.getElementById('hud');
const titleEl = document.getElementById('title');
const summaryEl = document.getElementById('summary');
const playBtn = document.getElementById('play');

// Colour grade inside the tone-mapping step (no extra render pass):
// ACES filmic -> +saturation -> lifted, slightly blue shadows.
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(
  'vec3 CustomToneMapping( vec3 color ) { return color; }',
  `vec3 CustomToneMapping( vec3 color ) {
     color = ACESFilmicToneMapping( color );
     float l = dot( color, vec3( 0.2126, 0.7152, 0.0722 ) );
     color = max( mix( vec3( l ), color, 1.2 ), 0.0 );
     return color * 0.975 + vec3( 0.010, 0.014, 0.030 );
   }`);

const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false });
} catch (e) { showMsg('WebGL is not available on this device/browser.'); throw e; }
renderer.setPixelRatio(MAX_DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.CustomToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const canvasEl = renderer.domElement;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#c6defa');
scene.fog = new THREE.Fog(HORIZON, 38, 150);
const camera = new THREE.PerspectiveCamera(45, 9 / 16, 0.05, 400);

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const easeInOut = v => { v = clamp01(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const easeOut = v => 1 - Math.pow(1 - clamp01(v), 3);
const easeIn = v => Math.pow(clamp01(v), 2);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

function makeCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function tex(w, h, draw, opts = {}) {
  const t = new THREE.CanvasTexture(makeCanvas(w, h, draw));
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function noise(g, w, h, n, a, dark = true, size = 2) {
  for (let i = 0; i < n; i++) { const v = dark ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${rnd() * a})`; g.fillRect(rnd() * w, rnd() * h, size, size); }
}
function scaleUV(geo, su, sv) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); return geo; }
const lam = (o) => new THREE.MeshLambertMaterial(o);
const phong = (o) => new THREE.MeshPhongMaterial(o);

/* =====================================================================
   1. Textures (all painted in code)
   ===================================================================== */
const T = {};
T.grass = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#5fae3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    const x = rnd() * w, y = rnd() * h, l = 3 + rnd() * 6;
    g.strokeStyle = rnd() < .5 ? `rgba(40,110,30,${.25 + rnd() * .3})` : `rgba(170,215,90,${.2 + rnd() * .3})`;
    g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 3, y - l); g.stroke();
  }
}, { repeat: true });
T.asphalt = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a4f5e'; g.fillRect(0, 0, w, h); noise(g, w, h, 2600, .35, true, 2); noise(g, w, h, 900, .18, false, 2);
  g.strokeStyle = 'rgba(20,20,30,.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(30, 0); g.bezierCurveTo(60, 90, 10, 160, 50, 256); g.stroke();
}, { repeat: true });
T.concrete = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9d4c8'; g.fillRect(0, 0, w, h); noise(g, w, h, 1500, .12);
  g.strokeStyle = 'rgba(70,60,50,.45)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.strokeRect(3, 3, w - 6, h - 6);
}, { repeat: true });
T.dash = tex(64, 256, (g, w, h) => { g.clearRect(0, 0, w, h); g.fillStyle = '#f2c230'; g.fillRect(8, 0, w - 16, h * .55); }, { repeat: true });
T.siding = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) {
    const gr = g.createLinearGradient(0, y, 0, y + 32);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(.8, '#eceff3'); gr.addColorStop(.86, '#a9adb8'); gr.addColorStop(1, '#f5f6f8');
    g.fillStyle = gr; g.fillRect(0, y, w, 32);
  }
  noise(g, w, h, 500, .05);
}, { repeat: true });
T.shingle = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = -1; c < 9; c++) {
    const x = c * 32 + (r % 2) * 16, y = r * 32, v = 200 + rnd() * 55;
    g.fillStyle = `rgb(${v},${v},${v})`; rrect(g, x + 1, y, 30, 30, 5); g.fill();
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x, y + 27, 32, 5);
  }
}, { repeat: true });
T.brick = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#d8cfc4'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 16; r++) for (let c = -1; c < 5; c++) {
    const x = c * 64 + (r % 2) * 32, y = r * 16, v = rnd() * 30;
    g.fillStyle = `rgb(${170 + v},${70 + v * .6},${55 + v * .4})`; g.fillRect(x + 2, y + 2, 60, 12);
  }
}, { repeat: true });
T.wood = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#a8743f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(80,45,20,${.15 + rnd() * .25})`; g.lineWidth = 1 + rnd() * 2; const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 6, h * .3, x - 6, h * .6, x + 3, h); g.stroke(); }
}, { repeat: true });
T.bark = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#6b4a33'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(30,18,10,${.2 + rnd() * .3})`; g.lineWidth = 2 + rnd() * 3; const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rnd() - .5) * 10, h); g.stroke(); }
}, { repeat: true });
T.window = tex(128, 192, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d7ecff'); gr.addColorStop(.45, '#7fa9d6'); gr.addColorStop(1, '#2e4a73');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(20, 0); g.lineTo(55, 0); g.lineTo(10, h); g.lineTo(-25, h); g.fill();
  g.fillStyle = '#f4e3c8'; g.fillRect(0, 0, 22, h); g.fillRect(w - 22, 0, 22, h);
  g.fillStyle = 'rgba(120,80,50,.35)'; for (let i = 0; i < 5; i++) { g.fillRect(4 + i * 4, 0, 1.5, h); g.fillRect(w - 20 + i * 4, 0, 1.5, h); }
  g.fillStyle = '#ffffff'; g.fillRect(w / 2 - 3, 0, 6, h); g.fillRect(0, h / 2 - 3, w, 6);
});
T.door = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 4;
  g.strokeRect(16, 18, 40, 90); g.strokeRect(72, 18, 40, 90); g.strokeRect(16, 130, 40, 108); g.strokeRect(72, 130, 40, 108);
  g.fillStyle = '#bfe0f5'; g.fillRect(22, 24, 28, 50); g.fillRect(78, 24, 28, 50);
});
T.shutter = tex(64, 192, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let y = 8; y < h - 8; y += 9) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(6, y, w - 12, 3); }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
});
T.cloud = tex(256, 128, (g, w, h) => {
  const puffs = [[70, 82, 42], [118, 62, 52], [168, 74, 44], [205, 90, 30], [40, 96, 28], [140, 92, 40]];
  for (const [x, y, r] of puffs) { const gr = g.createRadialGradient(x, y - r * .3, r * .2, x, y, r); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.75, '#f4f8ff'); gr.addColorStop(1, 'rgba(244,248,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const sh = g.createLinearGradient(0, 70, 0, 128); sh.addColorStop(0, 'rgba(150,170,215,0)'); sh.addColorStop(1, 'rgba(150,170,215,.55)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(0, 0, w, h);
});
T.blob = tex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(15,20,45,.6)'); gr.addColorStop(1, 'rgba(15,20,45,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
T.aoRect = tex(128, 128, (g, w, h) => {
  const id = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = Math.max(0, Math.abs(x - 63.5) - 40) / 24, dy = Math.max(0, Math.abs(y - 63.5) - 40) / 24;
    const a = Math.max(0, 1 - Math.hypot(dx, dy)); const i = (y * w + x) * 4;
    id.data[i] = 15; id.data[i + 1] = 20; id.data[i + 2] = 45; id.data[i + 3] = a * a * 120;
  }
  g.putImageData(id, 0, 0);
});
T.dot = tex(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,245,220,1)'); gr.addColorStop(1, 'rgba(255,245,220,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
T.number = tex(128, 64, (g, w, h) => { g.clearRect(0, 0, w, h); g.font = '900 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 6; g.strokeStyle = '#1b2440'; g.strokeText('42', w / 2, h / 2 + 2); g.fillStyle = '#ffffff'; g.fillText('42', w / 2, h / 2 + 2); });
T.mailInside = tex(64, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b1020'); gr.addColorStop(1, '#2a3550'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
T.flower = tex(64, 64, (g) => { for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(32 + Math.cos(a) * 14, 32 + Math.sin(a) * 14, 12, 0, 7); g.fill(); } g.fillStyle = '#f7d046'; g.beginPath(); g.arc(32, 32, 9, 0, 7); g.fill(); });

/* =====================================================================
   2. Sky, sun, clouds, distant land
   ===================================================================== */
const SUN = V(0.7, 0.5, 0.35).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  uniforms: { top: { value: new THREE.Color('#2e71da') }, mid: { value: new THREE.Color('#62a3ef') }, hor: { value: HORIZON.clone() }, sun: { value: SUN } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, hor, sun; varying vec3 vDir;
    void main(){ float h = vDir.y;
      vec3 c = h > 0.18 ? mix(mid, top, smoothstep(0.18, 0.75, h)) : mix(hor, mid, smoothstep(-0.02, 0.18, h));
      float s = max(dot(normalize(vDir), sun), 0.0);
      c += vec3(1.0, 0.85, 0.6) * (pow(s, 600.0) * 3.0 + pow(s, 12.0) * 0.18);
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);
sky.frustumCulled = false; scene.add(sky);

const clouds = [];
for (let i = 0; i < 12; i++) {
  const m = new THREE.SpriteMaterial({ map: T.cloud, fog: false, toneMapped: false, depthWrite: false, color: 0xffffff });
  const s = new THREE.Sprite(m);
  const a = rnd() * Math.PI * 2, r = 120 + rnd() * 90;
  s.position.set(Math.cos(a) * r, 35 + rnd() * 45, Math.sin(a) * r);
  const k = 40 + rnd() * 35; s.scale.set(k, k * .5, 1);
  s.userData.x0 = s.position.x; s.userData.v = 0.6 + rnd() * .8;
  scene.add(s); clouds.push(s);
}

const hillMat = lam({ color: '#4f9a45' });
for (const [x, z, sx, sy, sz] of [[-60, -120, 90, 18, 40], [30, -140, 110, 24, 45], [110, -110, 70, 14, 35], [-120, 110, 90, 20, 40], [40, 140, 120, 22, 50]]) {
  const h = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), hillMat); h.scale.set(sx, sy, sz); h.position.set(x, -4, z); scene.add(h);
}
// water tower on the horizon
{
  const tower = new THREE.Group(), metal = lam({ color: '#c9d3df' });
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 3.6, 20), metal); tank.position.y = 15; tower.add(tank);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(3.5, 1.6, 20), lam({ color: '#a33b32' })); cap.position.y = 17.6; tower.add(cap);
  for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + .78; const leg = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, 13.5, 6), metal); leg.position.set(Math.cos(a) * 2.6, 6.6, Math.sin(a) * 2.6); tower.add(leg); }
  tower.position.set(-34, 0, -82); scene.add(tower);
}

/* =====================================================================
   3. Street layout
   ROAD runs along X.  z: our curb -2 | grass strip | sidewalk -2.9..-4.3 | lawns | houses (front z=-11)
                       far curb 6 | grass strip | sidewalk 6.9..8.3 | lawns | houses (front z=15)
   ===================================================================== */
const statics = new THREE.Group(); // merged into a few draw calls at the end
function addS(mesh) { statics.add(mesh); return mesh; }
function plane(w, h, mat, su = 1, sv = 1) { return new THREE.Mesh(scaleUV(new THREE.PlaneGeometry(w, h), su, sv), mat); }
function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }

const grassMat = lam({ map: T.grass });
const concreteMat = lam({ map: T.concrete });
for (const [z0, z1] of [[-2, -160], [6, 160]]) {
  const g = plane(400, Math.abs(z1 - z0), grassMat, 400 / 2.2, Math.abs(z1 - z0) / 2.2);
  g.rotation.x = -Math.PI / 2; g.position.set(0, 0, (z0 + z1) / 2); g.receiveShadow = true; scene.add(g);
}
const road = plane(400, 8, lam({ map: T.asphalt }), 400 / 4, 2); road.rotation.x = -Math.PI / 2; road.position.set(0, -0.12, 2); road.receiveShadow = true; scene.add(road);
const dash = plane(400, .14, new THREE.MeshLambertMaterial({ map: T.dash, transparent: true }), 400 / 3, 1);
dash.material.map.rotation = Math.PI / 2; dash.rotation.x = -Math.PI / 2; dash.position.set(0, -0.11, 2); scene.add(dash);
for (const z of [-2, 6]) { const c = box(400, .16, .22, concreteMat); scaleUV(c.geometry, 200, .1); c.position.set(0, -0.05, z); c.receiveShadow = true; scene.add(c); }
for (const z of [-3.6, 7.6]) { const s = plane(400, 1.4, concreteMat, 400 / 1.4, 1); s.rotation.x = -Math.PI / 2; s.position.set(0, .012, z); s.receiveShadow = true; scene.add(s); }

/* ---------- houses ---------- */
function house(opts) {
  const { x, z, rotY = 0, wall, roof, trim = '#ffffff', door, shutter } = opts;
  const G = new THREE.Group();
  const W = 8, D = 7, H = 2.9, F = .5, RH = 2.3;
  const wallMat = lam({ map: T.siding, color: wall }); wallMat.userData.ao = true;
  const trimMat = lam({ color: trim }); trimMat.userData.ao = true;

  const sc = makeCanvas(w, h, (g) => { g.filter = `blur(${r}px)`; g.drawImage(c, 0, 0); });
  const shape = new THREE.CanvasTexture(sc); shape.colorSpace = THREE.NoColorSpace;
  return { map, shape, texel: 1.6 * r / Math.max(w, h) };
}

function makeRig(def, shared, proxy) {
  const parts = {};
  function card(name, art, w, h, px, py, z) {
    const geo = new THREE.PlaneGeometry(w, h); geo.translate((.5 - px) * w, (py - .5) * h, 0);
    let mesh;
    if (proxy) {
      mesh = new THREE.Mesh(geo, hiddenMat); mesh.castShadow = true;
      mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: art.map, alphaTest: .5 });
    } else {
      const mat = new THREE.ShaderMaterial({
        vertexShader: charVert, fragmentShader: charFrag, side: THREE.DoubleSide,
        uniforms: { map: { value: art.map }, shape: { value: art.shape }, texel: { value: art.texel }, L: shared.L, tint: shared.tint, rimCol: shared.rimCol, rim: shared.rim, shadeAmt: shared.shadeAmt },
      });
      mesh = new THREE.Mesh(geo, mat);
    }
    mesh.position.z = z; mesh.userData.art = art; parts[name] = mesh; return mesh;
  }
  const root = new THREE.Group(), body = new THREE.Group(), hips = new THREE.Group(), torsoPivot = new THREE.Group();
  root.add(body); body.add(hips); hips.position.y = def.hip; hips.add(torsoPivot);
  const A = def.art;
  const legs = {};
  for (const side of ['L', 'R']) {
    const thigh = new THREE.Group(); thigh.position.set(side === 'L' ? -def.legGap : def.legGap, 0, 0); hips.add(thigh);
    thigh.add(card('thigh' + side, A.thigh, def.thighW, def.thighL + .06, .5, .06 / (def.thighL + .06), -.012));
    const knee = new THREE.Group(); knee.position.y = -def.thighL; thigh.add(knee);
    knee.add(card('shin' + side, A.shin, def.shinW, def.shinL + .04, .5, .04 / (def.shinL + .04), -.014));
    legs[side] = { thigh, knee };
  }
  torsoPivot.add(card('torso', A.torso, def.torsoW, def.torsoH, .5, .96, 0));
  const neck = new THREE.Group(); neck.position.y = def.torsoH * .86; torsoPivot.add(neck);
  neck.add(card('head', A.head[def.face0], def.headS, def.headS, .5, def.headPivot, .014));
  if (A.hat) { const hat = new THREE.Group(); hat.position.y = def.hatY; neck.add(hat); hat.add(card('hat', A.hat, def.hatW, def.hatH, .5, .75, .02)); parts.hatPivot = hat; }
  const arms = {};
  for (const side of ['L', 'R']) {
    const sh = new THREE.Group(); sh.position.set((side === 'L' ? -1 : 1) * def.shoulderX, def.shoulderY, 0); torsoPivot.add(sh);
    sh.add(card('upper' + side, A.upper, def.armW, def.upperL + .05, .5, .05 / (def.upperL + .05), .022));
    const elbow = new THREE.Group(); elbow.position.y = -def.upperL; sh.add(elbow);
    elbow.add(card('fore' + side, A.fore, def.armW, def.foreL + .05, .5, .04 / (def.foreL + .05), .024));
    const hand = new THREE.Object3D(); hand.position.y = -def.foreL + .03; elbow.add(hand);
    arms[side] = { sh, elbow, hand };
  }
  if (A.bag) { const bag = new THREE.Group(); bag.position.set(def.bagX, def.bagY, 0); torsoPivot.add(bag); bag.add(card('bag', A.bag, def.bagS, def.bagS, .5, .1, .018)); parts.bagPivot = bag; }
  return { root, body, hips, torsoPivot, neck, legs, arms, parts, def };
}

function makeCharacter(def) {
  const shared = { L: { value: new THREE.Vector2(1, 0) }, tint: { value: new THREE.Color(1, 1, 1) }, rimCol: { value: new THREE.Color('#ffe2a8') }, rim: { value: .85 }, shadeAmt: { value: .4 } };
  const rig = makeRig(def, shared, false), shadow = makeRig(def, shared, true);
  const blob = plane(.9, .5, new THREE.MeshBasicMaterial({ map: T.blob, transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = .02;
  scene.add(rig.root, shadow.root, blob);
  return { rig, shadow, shared, blob, def };
}

/* ---------- character art ---------- */
function headArt(size, drawFn) { return partArt(size, size, drawFn); }
function inkStroke(g, w) { g.strokeStyle = INK; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; }
function limbArt(w, h, opts) {
  return partArt(w, h, (g) => {
    const cx = w / 2, lw = Math.max(7, w * .2);
    inkStroke(g, lw);
    g.beginPath(); g.moveTo(cx, opts.top || lw); g.lineTo(cx, h - (opts.endPad || lw)); g.stroke();
    if (opts.sleeve) { g.fillStyle = opts.sleeve; inkStroke(g, lw * .55); rrect(g, w * .14, 3, w * .72, h * (opts.sleeveH || .42), w * .3); g.fill(); g.stroke(); }
    if (opts.hand) { g.fillStyle = opts.hand; inkStroke(g, lw * .55); g.beginPath(); g.arc(cx, h - w * .3, w * .27, 0, 7); g.fill(); g.stroke(); }
    if (opts.shoe) { g.fillStyle = opts.shoe; inkStroke(g, lw * .4); g.beginPath(); g.ellipse(cx + w * .12, h - w * .2, w * .42, w * .18, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(cx, h - w * .26, w * .12, w * .05, 0, 0, 7); g.fill(); }
  });
}
function faceParts(g, cx, cy, expr, o) {
  // eyes
  g.fillStyle = INK; inkStroke(g, 11);
  const ey = cy + o.eyeY, dx = o.eyeDX;
  for (const s of [-1, 1]) {
    const ex = cx + s * dx;
    if (expr === 'blink') { g.beginPath(); g.moveTo(ex - 20, ey + 4); g.quadraticCurveTo(ex, ey + 14, ex + 20, ey + 4); g.stroke(); }
    else if (expr === 'grin' || expr === 'happy') { g.beginPath(); g.moveTo(ex - 22, ey + 10); g.quadraticCurveTo(ex, ey - 16, ex + 22, ey + 10); g.stroke(); }
    else {
      const px = expr === 'curious' ? 7 : 0;
      g.beginPath(); g.ellipse(ex + px, ey, 15, 23, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + px + 5, ey - 8, 6, 0, 7); g.fill(); g.fillStyle = INK;
    }
  }
  // brows
  inkStroke(g, 12); g.strokeStyle = o.brow || INK;
  const by = ey - 44;
  const raiseR = expr === 'curious' ? -16 : 0, worried = expr === 'hopeful' ? 8 : 0;
  g.beginPath(); g.moveTo(cx - dx - 26, by + 4 + worried); g.quadraticCurveTo(cx - dx, by - 8, cx - dx + 22, by + 2 - worried); g.stroke();
  g.beginPath(); g.moveTo(cx + dx - 22, by + 2 + raiseR - worried); g.quadraticCurveTo(cx + dx, by - 8 + raiseR, cx + dx + 26, by + 4 + raiseR + worried); g.stroke();
  // cheeks
  g.fillStyle = 'rgba(255,105,120,.33)';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * (dx + 30), ey + 46, 26, 14, 0, 0, 7); g.fill(); }
  // mouth
  const my = cy + o.mouthY; inkStroke(g, 10);
  if (expr === 'grin' || expr === 'happy') {
    g.fillStyle = '#5a1f2b'; g.beginPath(); g.moveTo(cx - 52, my - 6); g.quadraticCurveTo(cx, my + 72, cx + 52, my - 6); g.closePath(); g.fill(); g.stroke();
    g.save(); g.clip(); g.fillStyle = '#fff'; g.fillRect(cx - 60, my - 10, 120, 18); g.fillStyle = '#ff7f93'; g.beginPath(); g.ellipse(cx, my + 42, 24, 14, 0, 0, 7); g.fill(); g.restore();
    g.beginPath(); g.moveTo(cx - 52, my - 6); g.quadraticCurveTo(cx, my + 72, cx + 52, my - 6); g.closePath(); g.stroke();
  } else if (expr === 'curious') {
    g.beginPath(); g.moveTo(cx - 20, my + 6); g.quadraticCurveTo(cx + 4, my + 2, cx + 24, my - 6); g.stroke();
  } else if (expr === 'hopeful') {
    g.beginPath(); g.moveTo(cx - 24, my + 2); g.quadraticCurveTo(cx, my + 16, cx + 24, my + 2); g.stroke();
  } else {
    g.beginPath(); g.moveTo(cx - 28, my); g.quadraticCurveTo(cx, my + 22, cx + 28, my); g.stroke();
  }
}

/* =====================================================================
   7. Merge static geometry by material (few draw calls on the phone)
   ===================================================================== */
function bakeStatic(root) {
  root.updateMatrixWorld(true);
  const byMat = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (g.index) g = g.toNonIndexed();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (o.material.userData.ao) {
      const p = g.attributes.position, c = new Float32Array(p.count * 3);
      for (let i = 0; i < p.count; i++) { const v = .58 + .42 * smooth((p.getY(i) + .05) / .9); c[i * 3] = v; c[i * 3 + 1] = v; c[i * 3 + 2] = Math.min(1, v * 1.04); }
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));

    }
    for (const e of [0, 2]) { const t = t0 + e * BEAT; if (t > 14.3) break;
      EVENTS.push({ t, fn: (c, o, w) => { osc(c, o, 'sine', NOTE(ch[0] - 24), w, .01, .22, .45); osc(c, o, 'sine', 110, w, .002, .25, .14, 45); } }); }
  }
  EVENTS.push({ t: 14.3, fn: (c, o, w) => { for (const n of [0, 4, 7, 12]) osc(c, o, 'triangle', NOTE(n + 12), w, .01, .07, 1.4); osc(c, o, 'sine', NOTE(-24), w, .01, .2, 1.4); } });
  // footsteps from the walk cycle
  let prev = null;
  for (let t = 0; t < DURATION; t += .005) {
    const d = rosaPath(t).d, w = walkWeight(rosaPath, t), ph = Math.floor((d / STRIDE) * 2);
    if (prev !== null && ph !== prev && w > .3) { const tt = t; EVENTS.push({ t: tt, fn: (c, o, wh) => noiseHit(c, o, wh, 'lowpass', 900 + Math.random() * 300, 1, .32, .07) }); }
    prev = ph;
  }
  const add = (t, fn) => EVENTS.push({ t, fn });
  add(.0, (c, o, w) => noiseHit(c, o, w, 'bandpass', 300, .8, .18, 1.6, 1400));                        // crane swoosh
  add(2.85, (c, o, w) => osc(c, o, 'square', 300, w, .002, .05, .05));                                   // finger press
  add(3.13, (c, o, w) => { osc(c, o, 'sine', 620, w, .002, .25, .25); osc(c, o, 'sine', 1530, w, .002, .12, .18); noiseHit(c, o, w, 'bandpass', 2500, 2, .15, .04); });
  add(3.16, (c, o, w) => osc(c, o, 'sine', 440, w, .01, .1, .45, 300));                                  // spring wobble
  for (const t of [3.98, 10.38]) add(t, (c, o, w) => noiseHit(c, o, w, 'bandpass', 500, 1.2, .35, .4, 3000)); // whip whooshes
  add(8.6, (c, o, w) => { osc(c, o, 'sawtooth', 170, w, .03, .04, .35, 240); });                       // door creak
  add(9.0, (c, o, w) => { for (let i = 0; i < 4; i++) noiseHit(c, o, w + i * .045, 'highpass', 3000, 1, .12, .04); }); // paper rustle
  add(9.82, (c, o, w) => { osc(c, o, 'sine', 240, w, .002, .3, .12); noiseHit(c, o, w, 'lowpass', 1200, 1, .25, .06); }); // door shut
  add(10.07, (c, o, w) => { osc(c, o, 'sine', 700, w, .002, .2, .2); osc(c, o, 'sine', 1700, w, .002, .08, .14); });     // flag clunk
  for (const t of [.6, 1.9, 5.6, 7.1, 11.2, 13.4]) add(t, (c, o, w) => { osc(c, o, 'sine', 2600, w, .01, .03, .08, 3900); osc(c, o, 'sine', 3000, w + .12, .01, .025, .08, 4200); }); // birds
  EVENTS.sort((a, b) => a.t - b.t);
})();

/* =====================================================================
   10. Playback, adaptive resolution, benchmark
   ===================================================================== */
let t = 0, playing = false, finished = false, last = 0;
const frameMs = [];
let dpr = MAX_DPR, minDpr = MAX_DPR, adjN = 0, adjMs = 0, framesSeen = 0, cooldown = 0, dprChanges = 0;
let hudOn = false, hudTimer = 0, fpsAcc = 0, fpsN = 0, liveFps = 0, liveMs = 0;
const gpuName = (() => { try { const gl = renderer.getContext(); const e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (e) { return 'unknown'; } })();

function adapt(ms) {
  framesSeen++; if (framesSeen < 45) return;           // ignore warm-up (shader compile, uploads)
  cooldown -= ms; adjMs += ms; adjN++;
  if (adjN < 60 || cooldown > 0) return;
  const avg = adjMs / adjN; adjMs = 0; adjN = 0;
  if (avg > 19 && dpr > 1) { dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); dprChanges++; cooldown = 1500; }
  else if (avg < 13.5 && dpr < MAX_DPR) { dpr = Math.min(MAX_DPR, dpr + .25); renderer.setPixelRatio(dpr); dprChanges++; cooldown = 1500; }
  minDpr = Math.min(minDpr, dpr);
}
function drawHud(ms) {
  if (ms > 0) { fpsAcc += ms; fpsN++; } hudTimer += ms;
  if (hudTimer < 250 && ms > 0) return;
  if (fpsN) { liveMs = fpsAcc / fpsN; liveFps = 1000 / liveMs; } fpsAcc = 0; fpsN = 0; hudTimer = 0;
  if (!hudOn) return;
  const info = renderer.info.render;
  hudEl.textContent = `FPS   ${liveFps ? liveFps.toFixed(0) : '--'} (${liveMs ? liveMs.toFixed(1) : '--'} ms)\nt     ${t.toFixed(2)} / ${DURATION}\nDPR   ${dpr.toFixed(2)}  ${canvasEl.width}x${canvasEl.height}\ncalls ${info.calls}  tris ${info.triangles}`;
}
function frame(now) {
  const ms = last ? Math.min(now - last, 100) : 0; last = now;
  if (ms > 0) { frameMs.push(ms); adapt(ms); }
  t = Math.min(DURATION, t + ms / 1000);
  update(t); renderer.render(scene, camera); drawHud(ms);
  if (t >= DURATION) finish();
}
function play() {
  if (finished) reset();
  playing = true; last = 0; titleEl.style.opacity = 0; summaryEl.style.display = 'none';
  playBtn.textContent = '❚❚ Pause'; Sound.start(t);
  renderer.setAnimationLoop(frame);
}
function pause() { playing = false; renderer.setAnimationLoop(null); Sound.stop(); playBtn.textContent = finished ? '▶ Replay' : (t > 0 ? '▶ Resume' : '▶ Start'); }
function reset() { t = 0; finished = false; frameMs.length = 0; update(0); renderer.render(scene, camera); drawHud(0); }
function finish() {
  finished = true; pause();
  const n = frameMs.length; if (!n) return;
  const total = frameMs.reduce((a, b) => a + b, 0), sorted = [...frameMs].sort((a, b) => b - a);
  const wN = Math.max(1, Math.floor(n * .01)), low1 = 1000 / (sorted.slice(0, wN).reduce((a, b) => a + b, 0) / wN), avg = n / (total / 1000);
  const over = frameMs.filter(m => m > 20).length;
  summaryEl.innerHTML = `<b>Playback report</b>\nAverage FPS  ${avg.toFixed(1)}\n1% low FPS   ${low1.toFixed(1)}\nWorst frame  ${sorted[0].toFixed(1)} ms\nSlow frames  ${over} of ${n} (over 20 ms)\nResolution   start ${MAX_DPR.toFixed(2)}x, lowest ${minDpr.toFixed(2)}x, end ${dpr.toFixed(2)}x (${dprChanges} changes)\nCanvas       ${canvasEl.width}x${canvasEl.height}\nGPU          ${gpuName}`;
  summaryEl.style.display = 'block';
}
playBtn.addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('restart').addEventListener('click', () => { const was = playing; pause(); reset(); if (was) play(); });
document.getElementById('sound').addEventListener('click', (e) => { Sound.setMuted(!Sound.muted); e.currentTarget.textContent = Sound.muted ? '🔇' : '🔊'; });
document.getElementById('hudBtn').addEventListener('click', () => { hudOn = !hudOn; hudEl.style.display = hudOn ? 'block' : 'none'; drawHud(0); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
canvasEl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); pause(); showMsg('The GPU reset the page (WebGL context lost). Reload to try again.'); });

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.floor(Math.min(vw, vh * 9 / 16)), h = Math.floor(w * 16 / 9);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  capEl.style.fontSize = Math.round(w * .095) + 'px'; capEl.style.webkitTextStrokeWidth = Math.max(4, Math.round(w * .016)) + 'px';
  if (!playing) { update(t); renderer.render(scene, camera); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

resize();
renderer.compile(scene, camera);
reset();
playBtn.disabled = false;
window.__duration = DURATION;
window.__seek = (time) => { if (playing) pause(); t = Math.max(0, Math.min(DURATION, time)); update(t); renderer.render(scene, camera); };
window.__ready = true;
</script>
</body>
