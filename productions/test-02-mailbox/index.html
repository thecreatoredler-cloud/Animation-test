<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>The Little Red Flag — Test 02</title>
<style>
  :root { --bg:#0b0a12; --ink:#f6f1e7; --accent:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#7fb2ee; }
  #stage canvas { display:block; }
  #vignette { position:absolute; inset:0; pointer-events:none; display:none;
    background:radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(10,8,30,.38) 100%); }
  #cap { position:absolute; left:0; right:0; top:61%; text-align:center; pointer-events:none;
    font:900 40px/1 "Arial Rounded MT Bold","Nunito",system-ui,sans-serif; color:#fff;
    -webkit-text-stroke:7px #111; paint-order:stroke fill; text-shadow:0 4px 0 rgba(0,0,0,.35);
    transform-origin:50% 60%; white-space:nowrap; }
  #hud { position:absolute; top:10px; left:10px; padding:6px 8px; border-radius:6px; display:none;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre; background:rgba(0,0,0,.5); pointer-events:none; }
  #title { position:absolute; top:16%; left:0; right:0; text-align:center; pointer-events:none; transition:opacity .4s;
    text-shadow:0 2px 12px rgba(0,0,0,.55); }
  #title h1 { font-size:30px; font-weight:900; letter-spacing:.04em; }
  #title p { font-size:14px; margin-top:6px; opacity:.9; }
  #prep { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    background:#0b0a12; font-size:15px; line-height:1.6; padding:24px; transition:opacity .35s; }
  #summary { position:absolute; left:14px; right:14px; bottom:84px; display:none; padding:10px 14px;
    background:rgba(12,9,20,.9); border:1px solid rgba(255,255,255,.16); border-radius:12px;
    font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; }
  #summary b { color:var(--accent); font-family:system-ui,sans-serif; font-size:15px; }
  #controls { position:absolute; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:8px; }
  button { font:700 16px system-ui,sans-serif; border:0; border-radius:999px; min-height:48px; padding:0 24px;
    background:var(--accent); color:#1a1208; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  button.ghost { background:rgba(20,20,30,.45); color:var(--ink); padding:0 15px; font-size:14px; }
  button:active { transform:scale(.96); }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
    text-align:center; background:rgba(0,0,0,.85); font-size:15px; line-height:1.5; }
</style>

<body>
<div id="stage">
  <div id="vignette"></div>
  <div id="cap"></div>
  <div id="hud"></div>
  <div id="title"><h1>THE LITTLE RED FLAG</h1><p>Test 02 · tap Start (sound on)</p></div>
  <div id="summary"></div>
  <div id="controls">
    <button id="play" disabled>▶ Start</button>
    <button id="restart" class="ghost">↺</button>
    <button id="sound" class="ghost">🔊</button>
    <button id="hudBtn" class="ghost">HUD</button>
  </div>
  <div id="prep">Preparing the scene…<br><small>checking what your phone can handle</small></div>
  <div id="msg"></div>
</div>

<script>
  function showMsg(t){ var m=document.getElementById('msg'); m.textContent=t; m.style.display='flex'; }
  window.addEventListener('error', function(e){ showMsg('Error: ' + (e.message || 'a script failed to load')); });
  setTimeout(function(){ if(!window.__ready) showMsg('Could not start. Check the connection (Three.js loads from cdn.jsdelivr.net) and that WebGL is on.'); }, 25000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   0. Renderer, colour grade, helpers
   ===================================================================== */
const DURATION = 15.0;
const INK = '#1d1418';
const AUTOMATED = navigator.webdriver === true; // QA capture: always full quality
const stage = document.getElementById('stage');
const capEl = document.getElementById('cap');
const hudEl = document.getElementById('hud');
const titleEl = document.getElementById('title');
const summaryEl = document.getElementById('summary');
const playBtn = document.getElementById('play');
const prepEl = document.getElementById('prep');
const vignetteEl = document.getElementById('vignette');

// Grade lives in the tone-mapping step: warm push -> ACES -> saturation -> lifted blue-ish blacks.
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(
  'vec3 CustomToneMapping( vec3 color ) { return color; }',
  `vec3 CustomToneMapping( vec3 color ) {
     color *= vec3( 1.1, 1.0, 0.85 );
     color = ACESFilmicToneMapping( color );
     float l = dot( color, vec3( 0.2126, 0.7152, 0.0722 ) );
     color = max( mix( vec3( l ), color, 1.12 ), 0.0 );
     return color * 0.972 + vec3( 0.014, 0.012, 0.03 );
   }`);

const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false });
} catch (e) { showMsg('WebGL is not available on this device/browser.'); throw e; }
renderer.setPixelRatio(MAX_DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.CustomToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const canvasEl = renderer.domElement;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#d3e0f2');
scene.fog = new THREE.Fog(HORIZON, 45, 170);
const camera = new THREE.PerspectiveCamera(45, 9 / 16, 0.05, 420);

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const easeInOut = v => { v = clamp01(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const easeOut = v => 1 - Math.pow(1 - clamp01(v), 3);
const easeIn = v => Math.pow(clamp01(v), 2);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

function makeCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function tex(w, h, draw, opts = {}) {
  const t = new THREE.CanvasTexture(makeCanvas(w, h, draw));
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function noise(g, w, h, n, a, dark = true, size = 2) {
  for (let i = 0; i < n; i++) { const v = dark ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${rnd() * a})`; g.fillRect(rnd() * w, rnd() * h, size, size); }
}
function scaleUV(geo, su, sv) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); return geo; }
const lam = (o) => new THREE.MeshLambertMaterial(o);
const phong = (o) => new THREE.MeshPhongMaterial(o);

/* =====================================================================
   1. Textures (all painted in code)
   ===================================================================== */
const T = {};
T.grass = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#5fae3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    const x = rnd() * w, y = rnd() * h, l = 3 + rnd() * 6;
    g.strokeStyle = rnd() < .5 ? `rgba(40,110,30,${.25 + rnd() * .3})` : `rgba(170,215,90,${.2 + rnd() * .3})`;
    g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 3, y - l); g.stroke();
  }
}, { repeat: true });
T.asphalt = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a4f5e'; g.fillRect(0, 0, w, h); noise(g, w, h, 2600, .35, true, 2); noise(g, w, h, 900, .18, false, 2);
  g.strokeStyle = 'rgba(20,20,30,.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(30, 0); g.bezierCurveTo(60, 90, 10, 160, 50, 256); g.stroke();
}, { repeat: true });
T.concrete = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9d4c8'; g.fillRect(0, 0, w, h); noise(g, w, h, 1500, .12);
  g.strokeStyle = 'rgba(70,60,50,.45)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.strokeRect(3, 3, w - 6, h - 6);
}, { repeat: true });
T.dash = tex(64, 256, (g, w, h) => { g.clearRect(0, 0, w, h); g.fillStyle = '#f2c230'; g.fillRect(8, 0, w - 16, h * .55); }, { repeat: true });
T.siding = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) {
    const gr = g.createLinearGradient(0, y, 0, y + 32);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(.8, '#eceff3'); gr.addColorStop(.86, '#a9adb8'); gr.addColorStop(1, '#f5f6f8');
    g.fillStyle = gr; g.fillRect(0, y, w, 32);
  }
  noise(g, w, h, 500, .05);
}, { repeat: true });
T.shingle = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = -1; c < 9; c++) {
    const x = c * 32 + (r % 2) * 16, y = r * 32, v = 200 + rnd() * 55;
    g.fillStyle = `rgb(${v},${v},${v})`; rrect(g, x + 1, y, 30, 30, 5); g.fill();
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x, y + 27, 32, 5);
  }
}, { repeat: true });
T.brick = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#d8cfc4'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 16; r++) for (let c = -1; c < 5; c++) {
    const x = c * 64 + (r % 2) * 32, y = r * 16, v = rnd() * 30;
    g.fillStyle = `rgb(${170 + v},${70 + v * .6},${55 + v * .4})`; g.fillRect(x + 2, y + 2, 60, 12);
  }
}, { repeat: true });
T.wood = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#a8743f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(80,45,20,${.15 + rnd() * .25})`; g.lineWidth = 1 + rnd() * 2; const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 6, h * .3, x - 6, h * .6, x + 3, h); g.stroke(); }
}, { repeat: true });
T.bark = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#6b4a33'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(30,18,10,${.2 + rnd() * .3})`; g.lineWidth = 2 + rnd() * 3; const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rnd() - .5) * 10, h); g.stroke(); }
}, { repeat: true });
T.window = tex(128, 192, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d7ecff'); gr.addColorStop(.45, '#7fa9d6'); gr.addColorStop(1, '#2e4a73');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(20, 0); g.lineTo(55, 0); g.lineTo(10, h); g.lineTo(-25, h); g.fill();
  g.fillStyle = '#f4e3c8'; g.fillRect(0, 0, 22, h); g.fillRect(w - 22, 0, 22, h);
  g.fillStyle = 'rgba(120,80,50,.35)'; for (let i = 0; i < 5; i++) { g.fillRect(4 + i * 4, 0, 1.5, h); g.fillRect(w - 20 + i * 4, 0, 1.5, h); }
  g.fillStyle = '#ffffff'; g.fillRect(w / 2 - 3, 0, 6, h); g.fillRect(0, h / 2 - 3, w, 6);
});
T.door = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 4;
  g.strokeRect(16, 18, 40, 90); g.strokeRect(72, 18, 40, 90); g.strokeRect(16, 130, 40, 108); g.strokeRect(72, 130, 40, 108);
  g.fillStyle = '#bfe0f5'; g.fillRect(22, 24, 28, 50); g.fillRect(78, 24, 28, 50);
});
T.shutter = tex(64, 192, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let y = 8; y < h - 8; y += 9) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(6, y, w - 12, 3); }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
});
T.cloud = tex(256, 128, (g, w, h) => {
  const puffs = [[70, 82, 42], [118, 62, 52], [168, 74, 44], [205, 90, 30], [40, 96, 28], [140, 92, 40]];
  for (const [x, y, r] of puffs) { const gr = g.createRadialGradient(x, y - r * .3, r * .2, x, y, r); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.75, '#f4f8ff'); gr.addColorStop(1, 'rgba(244,248,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const sh = g.createLinearGradient(0, 70, 0, 128); sh.addColorStop(0, 'rgba(150,170,215,0)'); sh.addColorStop(1, 'rgba(150,170,215,.55)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(0, 0, w, h);
});
T.blob = tex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(15,20,45,.6)'); gr.addColorStop(1, 'rgba(15,20,45,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
T.aoRect = tex(128, 128, (g, w, h) => {
  const id = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = Math.max(0, Math.abs(x - 63.5) - 40) / 24, dy = Math.max(0, Math.abs(y - 63.5) - 40) / 24;
    const a = Math.max(0, 1 - Math.hypot(dx, dy)); const i = (y * w + x) * 4;
    id.data[i] = 15; id.data[i + 1] = 20; id.data[i + 2] = 45; id.data[i + 3] = a * a * 120;
  }
  g.putImageData(id, 0, 0);
});
T.dot = tex(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,245,220,1)'); gr.addColorStop(1, 'rgba(255,245,220,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
T.number = tex(128, 64, (g, w, h) => { g.clearRect(0, 0, w, h); g.font = '900 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 6; g.strokeStyle = '#1b2440'; g.strokeText('42', w / 2, h / 2 + 2); g.fillStyle = '#ffffff'; g.fillText('42', w / 2, h / 2 + 2); });
T.mailInside = tex(64, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b1020'); gr.addColorStop(1, '#2a3550'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
T.flower = tex(64, 64, (g) => { for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(32 + Math.cos(a) * 14, 32 + Math.sin(a) * 14, 12, 0, 7); g.fill(); } g.fillStyle = '#f7d046'; g.beginPath(); g.arc(32, 32, 9, 0, 7); g.fill(); });


T.hedge = tex(128, 128, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 500; i++) { const v = 150 + rnd() * 105; g.fillStyle = `rgb(${v},${v},${v})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 4 + rnd() * 4, 2 + rnd() * 3, rnd() * 3, 0, 7); g.fill(); } }, { repeat: true });
T.garage = tex(256, 192, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 48) { g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, y + 44, w, 4); for (let x = 0; x < w; x += 64) { g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; g.strokeRect(x + 6, y + 8, 52, 30); } } g.fillStyle = '#bfe0f5'; for (let x = 0; x < w; x += 64) g.fillRect(x + 10, 12, 44, 22); });
T.stop = tex(128, 128, (g, w, h) => { g.fillStyle = '#c8241f'; g.beginPath(); for (let i = 0; i < 8; i++) { const a = (i + .5) / 8 * Math.PI * 2; g.lineTo(64 + Math.cos(a) * 60, 64 + Math.sin(a) * 60); } g.closePath(); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 5; g.stroke(); g.fillStyle = '#fff'; g.font = '900 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('STOP', 64, 66); });
T.street = tex(256, 64, (g, w, h) => { g.fillStyle = '#1f6b45'; rrect(g, 2, 2, w - 4, h - 4, 8); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3; rrect(g, 7, 7, w - 14, h - 14, 6); g.stroke(); g.fillStyle = '#fff'; g.font = '800 32px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('MAPLE AVE', w / 2, h / 2 + 2); });
T.bird = tex(64, 32, (g) => { g.strokeStyle = '#2a2b3a'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(4, 12); g.quadraticCurveTo(18, 2, 32, 18); g.quadraticCurveTo(46, 2, 60, 12); g.stroke(); });
T.beam = tex(32, 256, (g, w, h) => {
  const id = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = (x + .5) / w - .5, v = y / (h - 1);
    const a = Math.exp(-u * u * 18) * Math.pow(Math.sin(Math.PI * v), .7) * (0.55 + .45 * v);
    const i = (y * w + x) * 4; id.data[i] = 255; id.data[i + 1] = 220; id.data[i + 2] = 170; id.data[i + 3] = a * 255;
  }
  g.putImageData(id, 0, 0);
});
T.water = tex(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(220,240,255,1)'); gr.addColorStop(1, 'rgba(160,210,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });

/* =====================================================================
   2. Sky, sun, clouds, distant land
   Golden afternoon: sun ~21 degrees high, front-right of the street.
   ===================================================================== */
const SUN = V(0.75, 0.36, 0.55).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#1d5fd6') }, mid: { value: new THREE.Color('#5d9ff0') }, hor: { value: new THREE.Color('#e6e3dc') }, warm: { value: new THREE.Color('#ffd09a') }, sun: { value: SUN } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, hor, warm, sun; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = d.y;
      float s = max(dot(d, sun), 0.0);
      vec3 horizon = mix(hor, warm, pow(s, 3.0) * 0.85);
      vec3 c = h > 0.2 ? mix(mid, top, smoothstep(0.2, 0.8, h)) : mix(horizon, mid, smoothstep(-0.02, 0.2, h));
      c += vec3(1.0, 0.82, 0.55) * (pow(s, 900.0) * 9.0 + pow(s, 60.0) * 0.6 + pow(s, 6.0) * 0.12);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), skyMat);
sky.frustumCulled = false; scene.add(sky);

const clouds = [];
for (let i = 0; i < 14; i++) {
  const m = new THREE.SpriteMaterial({ map: T.cloud, fog: false, depthWrite: false, color: new THREE.Color(1.25, 1.2, 1.15) });
  const s = new THREE.Sprite(m);
  const a = rnd() * Math.PI * 2, r = 130 + rnd() * 100;
  s.position.set(Math.cos(a) * r, 30 + rnd() * 50, Math.sin(a) * r);
  const k = 45 + rnd() * 40; s.scale.set(k, k * .5, 1);

const charVert = `varying vec2 vUv; varying float vY;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position,1.0); vY = w.y; gl_Position = projectionMatrix * viewMatrix * w; }`;

  uniform vec2 L; uniform vec3 keyCol; uniform vec3 shadeCol; uniform vec3 rimCol; uniform vec3 bounceCol;
  uniform float inSun; uniform float rim; uniform float shadeAmt; uniform float baseY; uniform float height;
  varying vec2 vUv; varying float vY;
  void main(){
    vec4 c = texture2D(map, vUv);
    if (c.a < 0.5) discard;
    float s  = texture2D(shape, vUv).a;
    float gx = texture2D(shape, vUv + vec2(texel, 0.0)).a - texture2D(shape, vUv - vec2(texel, 0.0)).a;
    float gy = texture2D(shape, vUv + vec2(0.0, texel)).a - texture2D(shape, vUv - vec2(0.0, texel)).a;
    vec2 n = -vec2(gx, gy); float nl = length(n); n = nl > 1e-4 ? n / nl : vec2(0.0);

  downMat.uniforms.tSrc.value = rtQ.texture; downMat.uniforms.texel.value.set(.5 / rtQ.width, .5 / rtQ.height); pass(downMat, rtE);
  blurMat.uniforms.tSrc.value = rtE.texture; blurMat.uniforms.dir.value.set(1 / rtE.width, 0); pass(blurMat, rtE2);
  blurMat.uniforms.tSrc.value = rtE2.texture; blurMat.uniforms.dir.value.set(0, 1 / rtE.height); pass(blurMat, rtE);
  const u = compMat.uniforms;
  u.tScene.value = rtScene.texture; u.tDepth.value = rtScene.depthTexture; u.tQ.value = rtQ.texture; u.tE.value = rtE.texture;
  u.sunVis.value = FX.sunVis; u.dof.value = POST.dof ? FX.dof : 0; u.focus.value = FX.focus; u.near.value = camera.near; u.far.value = camera.far;
  u.aspect.value = camera.aspect; u.thr.value = halfFloat ? 1.15 : .82;
  pass(compMat, null);
}

/* =====================================================================
   10. Sound: music + effects, synthesised with Web Audio (no files)
   ===================================================================== */
const Sound = {
  ctx: null, master: null, muted: false, noise: null, t0: 0, c0: 0,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const n = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = n;
  },
  start(t0) {
    this.init(); this.ctx.resume(); this.stop();
    const ctx = this.ctx, m = ctx.createGain(); m.gain.value = this.muted ? 0 : .85;
    const comp = ctx.createDynamicsCompressor(); m.connect(comp); comp.connect(ctx.destination); this.master = m;

  },
  clock() { if (!this.master || !this.ctx || this.ctx.state !== 'running') return null; const v = this.t0 + (this.ctx.currentTime - this.c0); return v < this.t0 ? null : v; },
  stop() { if (this.master) { const m = this.master; m.gain.setTargetAtTime(0, this.ctx.currentTime, .02); setTimeout(() => m.disconnect(), 120); this.master = null; } },
  setMuted(v) { this.muted = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0 : .85, this.ctx.currentTime, .03); },
};
function env(ctx, g, when, a, peak, dec) { g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + a); g.gain.exponentialRampToValueAtTime(.0001, when + a + dec); }

  env(ctx, g, when, a, peak, dec); o.connect(g); g.connect(out); o.start(when); o.stop(when + a + dec + .05);
}
function noiseHit(ctx, out, when, type, f, q, peak, dec, f2) {

  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, when + dec);
  const g = ctx.createGain(); env(ctx, g, when, .005, peak, dec); s.connect(fl); fl.connect(g); g.connect(out); s.start(when, Math.random() * .5); s.stop(when + dec + .05);
}
const EVENTS = [];
(function buildScore() {
  const BEAT = 60 / 112, NOTE = (n) => 261.63 * Math.pow(2, n / 12);
  const chords = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]];
  const bars = Math.ceil(14.4 / (BEAT * 4));
  for (let b = 0; b < bars; b++) {
    const ch = chords[b % 4], t0 = b * BEAT * 4;
    for (let e = 0; e < 8; e++) {
      const t = t0 + e * BEAT / 2; if (t > 14.3) break;
      const n = ch[[0, 1, 2, 1, 0, 2, 1, 2][e]] + 12;
      EVENTS.push({ t, fn: (c, o, w) => { osc(c, o, 'triangle', NOTE(n), w, .006, .09, .32); osc(c, o, 'sine', NOTE(n + 12), w, .004, .03, .18); } });
      if (e % 2 === 1) EVENTS.push({ t, fn: (c, o, w) => noiseHit(c, o, w, 'highpass', 7000, .7, .05, .05) });
    }
    for (const e of [0, 2]) { const t = t0 + e * BEAT; if (t > 14.3) break;
      EVENTS.push({ t, fn: (c, o, w) => { osc(c, o, 'sine', NOTE(ch[0] - 24), w, .01, .22, .45); osc(c, o, 'sine', 110, w, .002, .25, .14, 45); } }); }
  }
  EVENTS.push({ t: 14.3, fn: (c, o, w) => { for (const n of [0, 4, 7, 12]) osc(c, o, 'triangle', NOTE(n + 12), w, .01, .07, 1.4); osc(c, o, 'sine', NOTE(-24), w, .01, .2, 1.4); } });
  let prev = null;
  for (let t = 0; t < DURATION; t += .005) {
    const d = rosaDist(t), w = smooth(speedOf(rosaDist, t) / .55), ph = Math.floor((d / STRIDE) * 2);
    if (prev !== null && ph !== prev && w > .3) { const tt = t; EVENTS.push({ t: tt, fn: (c, o, wh) => noiseHit(c, o, wh, 'lowpass', 900 + Math.random() * 300, 1, .32, .07) }); }
    prev = ph;
  }
  const add = (t, fn) => EVENTS.push({ t, fn });
  add(.0, (c, o, w) => noiseHit(c, o, w, 'bandpass', 300, .8, .18, 1.8, 1400));
  add(2.85, (c, o, w) => osc(c, o, 'square', 300, w, .002, .05, .05));
  add(3.13, (c, o, w) => { osc(c, o, 'sine', 620, w, .002, .25, .25); osc(c, o, 'sine', 1530, w, .002, .12, .18); noiseHit(c, o, w, 'bandpass', 2500, 2, .15, .04); });
  add(3.16, (c, o, w) => osc(c, o, 'sine', 440, w, .01, .1, .45, 300));
  for (const t of [3.9, 8.2, 10.2]) add(t, (c, o, w) => noiseHit(c, o, w, 'bandpass', 500, 1.2, .3, .45, 3000));
  add(13.5, (c, o, w) => noiseHit(c, o, w, 'bandpass', 400, .9, .16, 1.3, 1600));
  add(8.6, (c, o, w) => osc(c, o, 'sawtooth', 170, w, .03, .04, .35, 240));
  add(9.0, (c, o, w) => { for (let i = 0; i < 4; i++) noiseHit(c, o, w + i * .045, 'highpass', 3000, 1, .12, .04); });
  add(9.82, (c, o, w) => { osc(c, o, 'sine', 240, w, .002, .3, .12); noiseHit(c, o, w, 'lowpass', 1200, 1, .25, .06); });
  add(10.07, (c, o, w) => { osc(c, o, 'sine', 700, w, .002, .2, .2); osc(c, o, 'sine', 1700, w, .002, .08, .14); });
  add(9.05, (c, o, w) => { for (const d of [0, .14]) { osc(c, o, 'sine', 2350, w + d, .002, .08, .35); osc(c, o, 'sine', 3520, w + d, .002, .04, .25); } }); // bike bell
  add(5.7, (c, o, w) => { for (const d of [0, .22]) { osc(c, o, 'sawtooth', 420, w + d, .005, .05, .09, 260); noiseHit(c, o, w + d, 'bandpass', 900, 2, .08, .08); } }); // dog barks
  for (const t of [.6, 1.9, 5.0, 7.1, 11.2, 13.4]) add(t, (c, o, w) => { osc(c, o, 'sine', 2600, w, .01, .03, .08, 3900); osc(c, o, 'sine', 3000, w + .12, .01, .025, .08, 4200); });
  EVENTS.sort((a, b) => a.t - b.t);
})();

/* =====================================================================
   11. Playback: warm-up, quality choice, locked resolution, report
   ===================================================================== */
let t = 0, playing = false, finished = false, last = 0;
const frameMs = [];
let dpr = MAX_DPR, cssW = 360, cssH = 640;
let hudOn = false, hudTimer = 0, fpsAcc = 0, fpsN = 0, liveFps = 0, liveMs = 0;
const gpuName = (() => { try { const gl = renderer.getContext(); const e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (e) { return 'unknown'; } })();

function setQuality(level, d) {
  POST.level = level; POST.on = level !== 'low'; POST.dof = level === 'high';
  dpr = d; renderer.setPixelRatio(d); renderer.setSize(cssW, cssH);
  if (POST.on) makeTargets(Math.round(cssW * d), Math.round(cssH * d));
  vignetteEl.style.display = POST.on ? 'none' : 'block';
}
function drawHud(ms) {
  if (ms > 0) { fpsAcc += ms; fpsN++; } hudTimer += ms;
  if (hudTimer < 250 && ms > 0) return;
  if (fpsN) { liveMs = fpsAcc / fpsN; liveFps = 1000 / liveMs; } fpsAcc = 0; fpsN = 0; hudTimer = 0;
  if (!hudOn) return;
  const info = renderer.info.render;
  hudEl.textContent = `FPS   ${liveFps ? liveFps.toFixed(0) : '--'} (${liveMs ? liveMs.toFixed(1) : '--'} ms)\nt     ${t.toFixed(2)} / ${DURATION}\nQ     ${POST.level}  DPR ${dpr.toFixed(2)}\nsize  ${canvasEl.width}x${canvasEl.height}\ncalls ${info.calls}  tris ${info.triangles}`;
}
function frame(now) {
  const ms = last ? Math.min(now - last, 100) : 0; last = now;
  if (ms > 0) frameMs.push(ms);
  t = Math.min(DURATION, t + ms / 1000);
  const at = Sound.clock(); if (at !== null) t = Math.min(DURATION, t + (at - t) * .1);   // stay locked to the audio clock
  update(t); renderFrame(); drawHud(ms);
  if (t >= DURATION) finish();
}
function play() {
  if (finished) reset();
  playing = true; last = 0; titleEl.style.opacity = 0; summaryEl.style.display = 'none';
  playBtn.textContent = '❚❚ Pause'; Sound.start(t);
  renderer.setAnimationLoop(frame);
}
function pause() { playing = false; renderer.setAnimationLoop(null); Sound.stop(); playBtn.textContent = finished ? '▶ Replay' : (t > 0 ? '▶ Resume' : '▶ Start'); }
function reset() { t = 0; finished = false; frameMs.length = 0; update(0); renderFrame(); drawHud(0); }
function finish() {
  finished = true; pause();
  const n = frameMs.length; if (!n) return;
  const total = frameMs.reduce((a, b) => a + b, 0), sorted = [...frameMs].sort((a, b) => b - a);
  const wN = Math.max(1, Math.floor(n * .01)), low1 = 1000 / (sorted.slice(0, wN).reduce((a, b) => a + b, 0) / wN), avg = n / (total / 1000);
  const over = frameMs.filter(m => m > 20).length, hitches = frameMs.filter(m => m > 33).length;
  summaryEl.innerHTML = `<b>Playback report</b>\nAverage FPS  ${avg.toFixed(1)}\n1% low FPS   ${low1.toFixed(1)}\nWorst frame  ${sorted[0].toFixed(1)} ms\nSlow frames  ${over} over 20 ms, ${hitches} over 33 ms (of ${n})\nQuality      ${POST.level}, ${dpr.toFixed(2)}x (${canvasEl.width}x${canvasEl.height})\nGPU          ${gpuName}`;
  summaryEl.style.display = 'block';
}
playBtn.addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('restart').addEventListener('click', () => { const was = playing; pause(); reset(); if (was) play(); });
document.getElementById('sound').addEventListener('click', (e) => { Sound.setMuted(!Sound.muted); e.currentTarget.textContent = Sound.muted ? '🔇' : '🔊'; });
document.getElementById('hudBtn').addEventListener('click', () => { hudOn = !hudOn; hudEl.style.display = hudOn ? 'block' : 'none'; drawHud(0); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
canvasEl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); pause(); showMsg('The GPU reset the page (WebGL context lost). Reload to try again.'); });

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  cssW = Math.floor(Math.min(vw, vh * 9 / 16)); cssH = Math.floor(cssW * 16 / 9);
  stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
  camera.aspect = cssW / cssH; camera.updateProjectionMatrix();
  capEl.style.fontSize = Math.round(cssW * .095) + 'px'; capEl.style.webkitTextStrokeWidth = Math.max(4, Math.round(cssW * .016)) + 'px';
}
window.addEventListener('resize', () => { if (playing) return; layout(); setQuality(POST.level, dpr); update(t); renderFrame(); });

// warm-up: compile every shader (hidden objects too), upload textures, then time a few frames to pick a quality level
const WARM_TIMES = [0, 1, 2.6, 3.4, 4.6, 6.2, 7.4, 9.0, 10.5, 11.5, 13.8, 14.8];
function forceVisible(v) { letter.visible = v; handInsert.visible = v; }
function measure(nFrames) {
  return new Promise(res => { let n = 0, lastT = 0; const ms = [];
    function step(now) { if (lastT) ms.push(now - lastT); lastT = now; update(WARM_TIMES[n % WARM_TIMES.length]); renderFrame(); n++;
      if (n < nFrames) requestAnimationFrame(step); else { const s = ms.slice(6).sort((a, b) => a - b); res(s[Math.floor(s.length / 2)] || 16); } }
    requestAnimationFrame(step); });
}
async function boot() {
  layout();
  setQuality('high', MAX_DPR);
  update(0); forceVisible(true); renderer.compile(scene, camera); renderFrame(); forceVisible(false);
  for (const wt of WARM_TIMES) { update(wt); renderFrame(); }
  if (!AUTOMATED) {
    const levels = [['high', MAX_DPR], ['medium', Math.min(MAX_DPR, 1.6)], ['low', Math.min(MAX_DPR, 1.35)]];
    for (const [lvl, d] of levels) { setQuality(lvl, d); const med = await measure(40); if (med < 17.8 || lvl === 'low') break; }
  }
  reset();
  if (AUTOMATED) prepEl.remove(); else { prepEl.style.opacity = 0; setTimeout(() => prepEl.remove(), 400); }
  playBtn.disabled = false;
  window.__duration = DURATION;
  window.__seek = (time) => { if (playing) pause(); t = Math.max(0, Math.min(DURATION, time)); update(t); renderFrame(); };
  window.__cam = (time) => { const c = camAt(time, { pos: new THREE.Vector3(), tgt: new THREE.Vector3(), fov: 0 }); return [c.pos.x, c.pos.y, c.pos.z, c.tgt.x, c.tgt.y, c.tgt.z, c.fov]; };
  window.__ready = true;
}
boot();
